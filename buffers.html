<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buffer Visualizer</title>
  <style>
    :root {
      --ut-crimson:  #C8102E;
      --ut-taupe:    #685C53;
      --ut-lavender: #FFCDFF;
      --bg-panel:    #FFF8FF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    [hidden] { display: none !important; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #FFFFFF;
      color: #000000;
      padding: 24px 16px 40px;
    }

    h1 {
      color: var(--ut-crimson);
      font-size: 1.7em;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--ut-taupe);
      font-size: 0.85em;
      text-align: center;
      margin-bottom: 20px;
    }

    #layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 340px) minmax(0, 498px);
      gap: 18px;
      max-width: 1204px;
      margin: 0 auto;
      align-items: start;
    }
    .column { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    #column-curve { max-width: 498px; }
    #top-bar, #difficulty-buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

    @media (max-width: 1120px) {
      #layout { grid-template-columns: 330px minmax(0, 1fr); }
      #column-vessel, #column-curve { grid-column: 2; }
      #column-controls { grid-row: 1 / span 2; }
    }
    @media (max-width: 760px) {
      #layout { grid-template-columns: minmax(0, 1fr); }
      #column-vessel, #column-curve, #column-controls { grid-column: 1; grid-row: auto; }
    }

    .panel {
      background: var(--bg-panel);
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    }

    .panel-title {
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ut-crimson);
      margin-bottom: 10px;
    }

    label, .field-label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 3px; }
    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }
    .input-row { display: flex; gap: 6px; align-items: center; }
    .input-row input[type=number] { flex: 1 1 auto; min-width: 0; width: 60px; }
    .input-row select { flex-shrink: 0; }
    .side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .pka-and-ph { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px; margin-bottom: 10px; }
    .add-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: end; }
    .side-by-side > *, .pka-and-ph > *, .add-row > * { min-width: 0; }
    .side-by-side select { padding-inline: 4px; }

    input[type=number], select {
      padding: 7px 8px;
      min-height: 36px;
      background: #FFFFFF;
      border: 1px solid var(--ut-taupe);
      border-radius: 6px;
      color: #000000;
      font-family: inherit;
      font-size: 14px;
    }
    select { max-width: 100%; }
    input[type=number]:disabled { background: #E4E4E4; border-color: #BFBFBF; color: #404040; cursor: not-allowed; }
    #pka-input, #ph-input, #temp-input, #stock-input { width: 100%; }
    #buffer-select { width: 100%; }
    input[type=range] { width: 100%; height: 24px; accent-color: var(--ut-crimson); cursor: pointer; }

    :focus-visible { outline: 3px solid var(--ut-crimson); outline-offset: 2px; }

    button {
      padding: 7px 14px;
      min-height: 36px;
      border-radius: 6px;
      border: 1px solid var(--ut-taupe);
      background: #FFFFFF;
      color: var(--ut-taupe);
      font-family: inherit;
      font-size: 0.88em;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    button:hover:not(:disabled) { background: var(--ut-lavender); border-color: var(--ut-crimson); color: #000000; }
    button:active:not(:disabled) { background: var(--ut-crimson); border-color: var(--ut-crimson); color: #FFFFFF; }
    button.active { background: #FFCDD2; border-color: var(--ut-crimson); color: #000000; font-weight: 600; }
    button:disabled { background: #E4E4E4; border-color: #BFBFBF; color: #404040; cursor: not-allowed; }
    .button-row { display: flex; gap: 6px; flex-wrap: wrap; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }

    .hint { font-size: 0.8em; color: var(--ut-taupe); line-height: 1.45; }
    .hint b { color: var(--ut-crimson); }
    .error { font-size: 0.82em; color: var(--ut-crimson); font-weight: 600; margin-top: 4px; min-height: 0; }
    .error:empty { display: none; }
    #forms-label { font-size: 0.88em; font-weight: 600; margin-top: 6px; }
    #buffer-note { margin-top: 4px; }

    /* ── Container ── */
    #vessel-svg { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto; }
    #vessel-label { text-align: center; font-weight: 600; font-size: 0.9em; margin-top: 2px; }
    .swap { animation: vessel-in 0.45s ease; }
    @keyframes vessel-in { from { opacity: 0; } to { opacity: 1; } }
    .flash-ring { display: none; fill: none; stroke: #000000; stroke-width: 2; }
    .conv .flash-ring { display: inline; animation: flash-pulse 1.2s ease-out; }
    @keyframes flash-pulse { from { opacity: 1; } to { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .swap, .conv .flash-ring { animation: none; }
    }
    #particle-legend { display: flex; flex-direction: column; gap: 4px; font-size: 0.88em; margin-top: 6px; }
    .legend-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .legend-name { display: flex; align-items: center; gap: 5px; }
    .legend-name svg { width: 34px; height: 24px; flex-shrink: 0; }
    .legend-item b { white-space: nowrap; }

    /* ── pH and buffering status ── */
    #solution-ph { text-align: center; font-size: 1.1em; font-weight: 600; }
    #readout-ph { color: var(--ut-crimson); font-size: 1.5em; font-weight: 700; }
    #status {
      margin-top: 6px;
      margin-bottom: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9em;
      text-align: center;
      border: 2px solid var(--ut-taupe);
    }
    #status.good { background: var(--ut-lavender); }
    #status.poor { background: #FFEBEE; border-color: var(--ut-crimson); }

    /* ── Curve ── */
    #curve { display: block; width: 100%; height: auto; touch-action: pan-y; cursor: crosshair; border-radius: 8px; }
    #curve-readout { font-size: 0.85em; color: var(--ut-taupe); margin-top: 6px; min-height: 1.3em; }

    /* ── Quiz ── */
    .quiz-header { display: flex; justify-content: space-between; gap: 8px; }
    .quiz-header .panel-title { margin-bottom: 8px; }
    #quiz-progress { font-size: 0.82em; flex-shrink: 0; }
    #quiz-prompt { font-size: 0.9em; line-height: 1.45; }
    .quiz-item { margin-top: 8px; padding: 4px 6px; border: 2px solid transparent; border-radius: 6px; min-width: 0; }
    .quiz-item > label:not(.quiz-option), .quiz-item > legend { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 7px; padding: 0; }
    .quiz-item > legend { float: left; width: 100%; }
    .quiz-item input[type=text] {
      width: 100%;
      padding: 7px 8px;
      min-height: 36px;
      background: #FFFFFF;
      border: 1px solid var(--ut-taupe);
      border-radius: 6px;
      color: #000000;
      font-family: inherit;
      font-size: 14px;
    }
    .quiz-item input[type=text]:disabled { background: #E4E4E4; border-color: #BFBFBF; color: #404040; }
    .quiz-option { clear: both; display: flex; align-items: flex-start; gap: 6px; font-size: 0.85em; font-weight: 400; line-height: 1.35; padding: 2px 0; margin: 0; cursor: pointer; }
    .quiz-option:has(input:checked) { font-weight: 600; }
    .quiz-option input { margin-top: 2px; accent-color: var(--ut-crimson); flex-shrink: 0; }
    .quiz-item.correct > legend::after, .quiz-item.correct > label:not(.quiz-option)::after { content: ' ✓'; }
    .quiz-item.wrong > legend::after, .quiz-item.wrong > label:not(.quiz-option)::after { content: ' ✗'; }
    .quiz-item.correct { background: #DBEAFE; border-color: #1565C0; color: #000000; }
    .quiz-item.wrong { background: #FFEBEE; border-color: #C8102E; color: #000000; }
    .quiz-item.correct input[type=text], .quiz-item.correct input[type=text]:disabled { background: #DBEAFE; border-color: #1565C0; color: #000000; }
    .quiz-item.wrong input[type=text], .quiz-item.wrong input[type=text]:disabled { background: #FFEBEE; border-color: #C8102E; color: #000000; }
    .quiz-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    #quiz-feedback { font-size: 0.85em; line-height: 1.5; margin-top: 10px; }
    #quiz-feedback:empty { display: none; }
    #quiz-feedback table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    #quiz-feedback td { padding: 4px; border-bottom: 1px solid #BFBFBF; }
    #quiz-feedback td:last-child { text-align: right; }

    /* ── History ── */
    #history { list-style: none; max-height: 150px; overflow-y: auto; font-size: 0.85em; margin-bottom: 8px; }
    #history li { padding: 4px 0; border-bottom: 1px solid #E8DDE8; }
    #history-empty { font-size: 0.85em; color: var(--ut-taupe); margin-bottom: 8px; }
  </style>
</head>
<body>

<h1>Buffer Visualizer</h1>
<p class="subtitle">Set the pH and add strong acid or base to see how a buffer responds</p>

<div id="top-bar">
  <button id="quiz-toggle" aria-pressed="false">Quiz Mode</button>
  <button id="reset">Reset</button>
</div>
<div id="difficulty-buttons" role="group" aria-label="Quiz difficulty" hidden>
  <button id="difficulty-easy">Easy Mode</button>
  <button id="difficulty-hard">Hard Mode</button>
</div>

<div id="layout">
  <!-- ── Controls ── -->
  <div class="column" id="column-controls">
    <section class="panel" id="quiz-box" aria-labelledby="quiz-title" hidden>
      <div class="quiz-header">
        <h2 class="panel-title" id="quiz-title">Quiz</h2>
        <span id="quiz-progress"></span>
      </div>
      <div id="quiz-question"></div>
      <div class="quiz-buttons" id="quiz-buttons">
        <button id="quiz-check">Check</button>
        <button id="quiz-show" hidden>Show answer</button>
        <button id="quiz-next" hidden>Next</button>
      </div>
      <div id="quiz-feedback" role="status"></div>
      <div class="quiz-buttons" id="quiz-end-buttons" hidden>
        <button id="quiz-again">Try Again</button>
        <button id="quiz-exit">Exit Quiz</button>
      </div>
    </section>

    <section class="panel" id="buffer-panel">
      <h2 class="panel-title">Buffer</h2>
      <div class="field">
        <label for="buffer-select">Buffer system</label>
        <select id="buffer-select"></select>
        <div id="forms-label"></div>
        <p class="hint" id="buffer-note" hidden></p>
      </div>
      <div class="side-by-side">
        <div>
          <label for="conc-input">Buffer concentration</label>
          <div class="input-row">
            <input type="number" id="conc-input" min="0" step="any" value="50">
            <select id="conc-unit" aria-label="Concentration unit">
              <option value="mM" selected>mM</option>
              <option value="M">M</option>
            </select>
          </div>
          <input type="range" id="conc-slider" min="0" max="1000" step="1" aria-label="Buffer concentration, 1 mM to 1 M">
        </div>
        <div>
          <label for="vol-input">Volume</label>
          <div class="input-row">
            <input type="number" id="vol-input" min="0" step="any" value="500">
            <select id="vol-unit" aria-label="Volume unit">
              <option value="µL">µL</option>
              <option value="mL" selected>mL</option>
              <option value="L">L</option>
            </select>
          </div>
          <input type="range" id="vol-slider" min="0" max="1000" step="1" aria-label="Volume, 100 µL to 2 L">
        </div>
      </div>
      <div class="pka-and-ph">
        <div id="pka-field">
          <label for="pka-input">pKa</label>
          <input type="number" id="pka-input" min="0" max="14" step="0.01" value="4.76">
        </div>
        <div>
          <label for="ph-input">Set pH</label>
          <input type="number" id="ph-input" min="0" max="14" step="0.01">
          <input type="range" id="ph-slider" min="0" max="14" step="0.01" aria-label="pH">
        </div>
        <div>
          <label for="temp-input">Temperature (°C)</label>
          <input type="number" id="temp-input" min="0" max="60" step="1" value="25">
          <input type="range" id="temp-slider" min="0" max="60" step="1" aria-label="Temperature, 0 to 60 °C">
        </div>
      </div>
      <p class="error" id="buffer-error" role="alert"></p>
    </section>

    <section class="panel">
      <h2 class="panel-title">Add Strong Acid or Base</h2>
      <div class="field">
        <div class="button-row" role="group" aria-label="Reagent">
          <button id="reagent-hcl" class="active" aria-pressed="true">HCl</button>
          <button id="reagent-naoh" aria-pressed="false">NaOH</button>
        </div>
      </div>
      <div class="add-row">
        <div>
          <label for="stock-input">Stock (M)</label>
          <input type="number" id="stock-input" min="0" step="any" value="5">
        </div>
        <div>
          <label for="add-vol-input">Volume added</label>
          <div class="input-row">
            <input type="number" id="add-vol-input" min="0" step="any" value="0.1">
            <select id="add-vol-unit" aria-label="Volume added unit">
              <option value="µL">µL</option>
              <option value="mL" selected>mL</option>
            </select>
          </div>
        </div>
        <button id="add-button">Add</button>
      </div>
      <p class="error" id="add-error" role="alert"></p>
    </section>

  </div>

  <!-- ── Container and readout ── -->
  <div class="column" id="column-vessel">
    <section class="panel">
      <h2 class="panel-title">Solution</h2>
      <div id="solution-ph">pH <span id="readout-ph"></span></div>
      <div id="status" aria-live="polite"></div>
      <svg id="vessel-svg" viewBox="0 0 300 330" role="img">
        <defs>
          <clipPath id="vessel-clip"><path id="vessel-clip-path"></path></clipPath>
          <g id="glyph-defs"></g>
        </defs>
        <g clip-path="url(#vessel-clip)"><rect id="liquid" x="0" width="300" fill="#FFCDFF" fill-opacity="0.55"></rect></g>
        <g id="particles"></g>
        <g id="vessel-body"></g>
      </svg>
      <div id="vessel-label"></div>
      <div id="particle-legend">
        <div class="legend-item"><span class="legend-name" id="legend-acid"></span><b id="readout-acid-conc"></b></div>
        <div class="legend-item"><span class="legend-name" id="legend-base"></span><b id="readout-base-conc"></b></div>
      </div>
    </section>
  </div>

  <!-- ── Curve and history ── -->
  <div class="column" id="column-curve">
    <section class="panel">
      <h2 class="panel-title">Titration Curve</h2>
      <canvas id="curve" role="img"></canvas>
      <p id="curve-readout">Hover over or touch the plot to read a point on the curve</p>
    </section>

    <section class="panel">
      <h2 class="panel-title">History</h2>
      <p id="history-empty">No additions yet.</p>
      <ol id="history"></ol>
      <button id="undo-button" disabled>Undo last</button>
    </section>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  BUFFER DATA
// ═══════════════════════════════════════════════════════════════
// Every buffer on the page. pKa values are the commonly tabulated 25 °C figures.
//   dpKadT      change in pKa per °C, used to shift the pKa linearly away from 25 °C
//   acid, base  labels for the acid and base forms, used everywhere the page names them
//   acidSite, baseSite   what the highlighted protonation site is in each form's glyph
//   baseCharge  the mark on the glyph's site in the base form: '−' if anionic there, '' if neutral
//   core        simplified skeleton of the glyph, around a site at (siteX, siteY)
//   note        an optional one-line note shown under the dropdown
const BUFFERS = {
  generic: {
    name: 'HA / A⁻', pKa: 4.76, acid: 'HA', base: 'A⁻', editablePKa: true,
  },
  acetate: {
    name: 'Acetate', pKa: 4.76, dpKadT: 0.0002, acid: 'CH₃COOH', base: 'CH₃COO⁻',
    acidSite: 'carboxyl –COOH', baseSite: 'carboxylate –COO⁻', baseCharge: '−',
    core: 'M-13,5 L-5,0 M-5,0 L-5,-8 M-3,0 L-3,-8 M-5,0 L3,4', siteX: 6, siteY: 5,
  },
  mes: {
    name: 'MES', pKa: 6.15, dpKadT: -0.011, acid: 'MES±', base: 'MES⁻',
    acidSite: 'ring N–H⁺', baseSite: 'ring N', baseCharge: '',
    core: 'M-1,0 L-5,-7 L-13,-7 L-17,0 L-13,7 L-5,7 Z M3,0 L9,4 L15,-1', siteX: 0, siteY: 0,
  },
  mops: {
    name: 'MOPS', pKa: 7.20, dpKadT: -0.015, acid: 'MOPS±', base: 'MOPS⁻',
    acidSite: 'ring N–H⁺', baseSite: 'ring N', baseCharge: '',
    core: 'M-3,0 L-7,-7 L-15,-7 L-19,0 L-15,7 L-7,7 Z M1,0 L6,5 L11,0 L16,5', siteX: -2, siteY: 0,
  },
  hepes: {
    name: 'HEPES', pKa: 7.50, dpKadT: -0.014, acid: 'HEPES±', base: 'HEPES⁻',
    acidSite: 'piperazine N–H⁺', baseSite: 'piperazine N', baseCharge: '',
    core: 'M2,0 L-2,-7 L-10,-7 L-14,0 L-10,7 L-2,7 Z M-14,0 L-19,4 M6,0 L12,4 L17,-1', siteX: 3, siteY: 0,
  },
  tris: {
    name: 'Tris', pKa: 8.07, dpKadT: -0.028, acid: 'TrisH⁺', base: 'Tris',
    acidSite: 'amine –NH₃⁺', baseSite: 'amine –NH₂', baseCharge: '',
    core: 'M-6,0 L-14,-7 M-6,0 L-15,0 M-6,0 L-14,7 M-6,0 L2,0', siteX: 5, siteY: 0,
  },
  bicarbonate: {
    name: 'Bicarbonate', pKa: 6.1, dpKadT: -0.0055, acid: 'CO₂/H₂CO₃', base: 'HCO₃⁻',
    acidSite: 'H₂CO₃ –OH', baseSite: 'HCO₃⁻ –O⁻', baseCharge: '−',
    core: 'M-5,0 L-13,-6 M-5,0 L-5,-9 M-3,0 L-3,-9 M-5,0 L3,3', siteX: 6, siteY: 4,
    note: 'Closed system here. Blood (pH 7.4) holds HCO₃⁻/CO₂ near 20:1, outside pKa ± 1, and stays buffered because lungs and kidneys keep regulating CO₂ and HCO₃⁻.',
  },
};

const DEFAULTS = { buffer: 'generic', concentration: 0.05, volume: 0.5, temperature: 25 };
// pKw of water by temperature (°C), interpolated between these standard values
const PKW_TABLE = [[0, 14.94], [10, 14.53], [20, 14.17], [25, 14.00], [30, 13.83], [37, 13.62], [40, 13.53], [50, 13.26], [60, 13.02]];
const MIN_TEMPERATURE = 0, MAX_TEMPERATURE = 60;
const MIN_VOLUME = 1e-4, MAX_VOLUME = 2;    // L: 100 µL to 2 L

// ═══════════════════════════════════════════════════════════════
//  CHEMISTRY
// ═══════════════════════════════════════════════════════════════
// netBase is the moles of strong base (NaOH) minus strong acid (HCl) relative to the buffer all in
// its acid form, with any counterion of that form left out because it cancels. Then for HA/A⁻ and
// BH⁺/B alike, the charge balance is  [H⁺] + netBase/V = [OH⁻] + [base form].
const state = {
  buffer: DEFAULTS.buffer,
  pKa: BUFFERS[DEFAULTS.buffer].pKa,
  temperature: DEFAULTS.temperature,             // °C
  volume: DEFAULTS.volume,                       // L
  totalMoles: DEFAULTS.concentration * DEFAULTS.volume,
  netBase: 0,                                    // mol
  concUnit: 'mM',
  reagent: 'HCl',
  history: [],                                   // { label, before: {volume, totalMoles, netBase} }
};

// A running quiz. Its solutions live in state, and exitQuiz() puts back what was there.
const quiz = {
  active: false,
  hard: false,
  set: [],
  index: 0,
  attempt: 1,
  finished: false,   // this question has been answered, or its answer shown
  credits: [],
  saved: null,
};

// During a question the readouts are hidden, and they return once it is answered.
const answersHidden = () => quiz.active && !quiz.finished;

function pKwAt(temperature) {
  for (let i = 1; i < PKW_TABLE.length; i++) {
    const [t0, p0] = PKW_TABLE[i - 1], [t1, p1] = PKW_TABLE[i];
    if (temperature <= t1) return p0 + (temperature - t0) / (t1 - t0) * (p1 - p0);
  }
  return PKW_TABLE.at(-1)[1];
}

const pKaAt = (key, temperature) => BUFFERS[key].pKa + (BUFFERS[key].dpKadT ?? 0) * (temperature - 25);

let KW = 10 ** -pKwAt(DEFAULTS.temperature);

const baseFraction = (H, Ka) => Ka / (Ka + H);

// [H⁺] from the charge balance. It rises steadily with [H⁺], so bisection on log[H⁺] always converges.
function solveH(S, totalConc, Ka) {
  let lo = -20, hi = Math.log10(Math.abs(S) + totalConc + 1);
  for (let i = 0; i < 100; i++) {
    const mid = (lo + hi) / 2, H = 10 ** mid;
    if (H + S - KW / H - totalConc * baseFraction(H, Ka) > 0) hi = mid; else lo = mid;
  }
  return 10 ** ((lo + hi) / 2);
}

// The net strong base concentration that makes a solution sit at this pH
function chargeForPH(pH, totalConc, Ka) {
  const H = 10 ** -pH;
  return KW / H - H + totalConc * baseFraction(H, Ka);
}

const ka = () => 10 ** -state.pKa;
const totalConc = () => state.totalMoles / state.volume;
const currentH = () => solveH(state.netBase / state.volume, totalConc(), ka());
const currentPH = () => -Math.log10(currentH());
const equivalents = () => state.netBase / state.totalMoles;
const curvePH = (eq, conc = totalConc()) => -Math.log10(solveH(eq * conc, conc, ka()));

function composition() {
  const H = currentH(), fb = baseFraction(H, ka());
  const baseMoles = state.totalMoles * fb, acidMoles = state.totalMoles - baseMoles;
  return {
    pH: -Math.log10(H), fb, acidMoles, baseMoles,
    acidConc: acidMoles / state.volume, baseConc: baseMoles / state.volume,
    ratio: fb / (1 - fb),
  };
}

// Sets the pH at the current amounts, leaving the volume alone
function setNetBaseForPH(pH) {
  state.netBase = chargeForPH(pH, totalConc(), ka()) * state.volume;
}

// ═══════════════════════════════════════════════════════════════
//  ACTIONS — each returns an error message, or null when applied
// ═══════════════════════════════════════════════════════════════
function clearHistory() {
  state.history = [];
}

const snapshot = () => ({ volume: state.volume, totalMoles: state.totalMoles, netBase: state.netBase });

function setPH(pH) {
  if (!Number.isFinite(pH) || pH < 0 || pH > 14) return 'Enter a pH from 0 to 14.';
  setNetBaseForPH(pH);
  clearHistory();
  render();
  return null;
}

function setBuffer(key) {
  state.buffer = key;
  state.pKa = pKaAt(key, state.temperature);
  setNetBaseForPH(state.pKa);
  clearHistory();
  buildGlyphs();
  // Every particle is now a different molecule, so its drawing has to change
  for (const p of particles) p.el.remove();
  particles.length = 0;
  render();
  return null;
}

function setGenericPKa(pKa) {
  if (!Number.isFinite(pKa) || pKa < 0 || pKa > 14) return 'Enter a pKa from 0 to 14.';
  const pH = currentPH();
  state.pKa = pKa;
  setNetBaseForPH(pH);
  clearHistory();
  render();
  return null;
}

// The same solution warmed or cooled: its contents stay put, so the pKa and pKw shift and the pH
// follows. The generic pKa is the student's own number and stays as entered.
function setTemperature(temperature) {
  if (!Number.isFinite(temperature) || temperature < MIN_TEMPERATURE || temperature > MAX_TEMPERATURE) {
    return `Enter a temperature from ${MIN_TEMPERATURE} to ${MAX_TEMPERATURE} °C.`;
  }
  state.temperature = temperature;
  KW = 10 ** -pKwAt(temperature);
  if (!BUFFERS[state.buffer].editablePKa) state.pKa = pKaAt(state.buffer, temperature);
  clearHistory();
  render();
  return null;
}

function setConcentration(molar) {
  if (!Number.isFinite(molar) || molar <= 0 || molar > 5) return 'Enter a concentration above 0 and up to 5 M.';
  const pH = currentPH();
  state.totalMoles = molar * state.volume;
  setNetBaseForPH(pH);
  clearHistory();
  render();
  return null;
}

// A different batch of the same solution: concentration and pH stay, the moles scale with volume
function setVolume(litres) {
  if (!Number.isFinite(litres) || litres < MIN_VOLUME - 1e-12 || litres > MAX_VOLUME + 1e-12) {
    return 'Enter a volume from 100 µL to 2 L.';
  }
  const pH = currentPH(), conc = totalConc();
  state.volume = litres;
  state.totalMoles = conc * litres;
  setNetBaseForPH(pH);
  clearHistory();
  render();
  return null;
}

function addStrong(reagent, stockMolar, addedLitres) {
  if (!Number.isFinite(stockMolar) || stockMolar <= 0 || stockMolar > 20) return 'Enter a stock concentration above 0 and up to 20 M.';
  if (!Number.isFinite(addedLitres) || addedLitres <= 0) return 'Enter a volume to add above 0.';
  if (state.volume + addedLitres > MAX_VOLUME + 1e-12) return 'That would take the volume past 2 L.';
  const before = snapshot(), pHBefore = currentPH();
  const moles = stockMolar * addedLitres;
  state.netBase += reagent === 'NaOH' ? moles : -moles;
  state.volume += addedLitres;
  state.history.push({
    label: `${formatVolume(addedLitres)} of ${formatNumber(stockMolar)} M ${reagent} (${formatMoles(moles)})`,
    pHChange: `pH ${pHBefore.toFixed(2)} → ${currentPH().toFixed(2)}`,
    before,
  });
  render(true);
  return null;
}

function undoLast() {
  const last = state.history.pop();
  if (!last) return;
  Object.assign(state, last.before);
  render();
}

function reset() {
  state.temperature = DEFAULTS.temperature;
  KW = 10 ** -pKwAt(state.temperature);
  state.pKa = pKaAt(state.buffer, state.temperature);
  state.volume = DEFAULTS.volume;
  state.totalMoles = DEFAULTS.concentration * DEFAULTS.volume;
  state.concUnit = 'mM';
  setNetBaseForPH(state.pKa);
  clearHistory();
  particleScale = null;
  document.getElementById('conc-unit').value = 'mM';
  document.getElementById('vol-unit').value = 'mL';
  for (const id of ['buffer-error', 'add-error']) showError(id, null);
  render();
}

// ═══════════════════════════════════════════════════════════════
//  FORMATTING
// ═══════════════════════════════════════════════════════════════
function formatNumber(x, sig = 4) {
  if (x === 0) return '0';
  const abs = Math.abs(x);
  if (abs >= 1e5 || abs < 1e-3) {
    const [m, e] = x.toExponential(2).split('e');
    const superscript = String(+e).replace(/[-0-9]/g, c => '⁻⁰¹²³⁴⁵⁶⁷⁸⁹'['-0123456789'.indexOf(c)]);
    return `${m} × 10${superscript}`;
  }
  return String(+x.toPrecision(sig));
}

function formatMoles(mol) {
  if (mol === 0) return '0 mol';
  for (const [factor, unit] of [[1, 'mol'], [1e-3, 'mmol'], [1e-6, 'µmol'], [1e-9, 'nmol']]) {
    if (mol >= factor) return `${formatNumber(mol / factor)} ${unit}`;
  }
  return `${formatNumber(mol / 1e-12)} pmol`;
}

function formatVolume(litres) {
  if (litres >= 1) return `${formatNumber(litres)} L`;
  if (litres >= 1e-3) return `${formatNumber(litres * 1e3)} mL`;
  return `${formatNumber(litres * 1e6)} µL`;
}

const CONC_FACTOR = { mM: 1e3, M: 1 };
const VOL_FACTOR = { 'µL': 1e6, mL: 1e3, L: 1 };
const formatConc = (molar, unit = state.concUnit) => `${formatNumber(molar * CONC_FACTOR[unit])} ${unit}`;

// ═══════════════════════════════════════════════════════════════
//  QUIZ QUESTIONS (no DOM access)
// ═══════════════════════════════════════════════════════════════
// A question is plain data: what to ask, how to grade it, and the solution to show beside it.
// tolerance is a fraction of the true value. A pH uses tolerancePH, in pH units.
const CALCULATED_TOLERANCE = 0.02;    // worked directly from the numbers given
const STOCK_VOLUME_TOLERANCE = 0.05;  // several steps, and Henderson–Hasselbalch ignores a little
const PH_TOLERANCE = 0.05;

const QUIZ_TYPES = {
  easy: ['hendersonHasselbalch', 'amounts', 'chooseBuffer', 'predominantForm'],
  hard: ['phAfterAddition', 'amountToReachPH', 'preparingBuffer'],
};
const QUIZ_LENGTH = 5;
// Bicarbonate is left out, since its note about blood goes beyond these questions.
const QUIZ_BUFFERS = ['generic', 'acetate', 'mes', 'mops', 'hepes', 'tris'];
const HH_HINT = 'Use pH = pKa + log([base form]/[acid form]).';
const NEUTRALIZE_HINT = 'Strong base converts acid form to base form mole for mole, and strong acid does the reverse. Work in moles, then use Henderson–Hasselbalch. Convert units first: 1 M = 1000 mM, and 1 L = 1000 mL.';

const pick = (list, rand) => list[Math.floor(rand() * list.length)];

function shuffled(list, rand) {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function quizBuffer(rand) {
  const key = pick(QUIZ_BUFFERS, rand), b = BUFFERS[key];
  // The HA / A⁻ buffer has no real pKa of its own, so it varies for variety.
  const pKa = key === 'generic' ? Number((4.5 + rand() * 4.5).toFixed(2)) : b.pKa;
  return { key, pKa, name: b.name, acid: b.acid, base: b.base };
}

const describeBuffer = b => `The buffer is ${b.name} (pKa ${b.pKa.toFixed(2)}), with acid form ${b.acid} and base form ${b.base}.`;

function numberItem(key, label, unit, truth, tolerance) {
  return { key, kind: 'number', label, unit, truth, tolerance };
}
function pHItem(key, label, truth) {
  return { key, kind: 'number', label, unit: '', truth, tolerancePH: PH_TOLERANCE };
}
function choiceItem(key, label, options, answer) {
  return { key, kind: 'choice', label, options, answer };
}

// conc in M, volume in L
function sceneAtPH(b, conc, volume, pH) {
  return { buffer: b.key, pKa: b.pKa, volume, totalMoles: conc * volume, netBase: chargeForPH(pH, conc, 10 ** -b.pKa) * volume };
}

// The exact result of adding strong acid or base to a scene
function afterAddition(scene, netChange, addedLitres) {
  const volume = scene.volume + addedLitres, net = scene.netBase + netChange;
  const H = solveH(net / volume, scene.totalMoles / volume, 10 ** -scene.pKa);
  const fb = baseFraction(H, 10 ** -scene.pKa);
  return { pH: -Math.log10(H), baseMoles: scene.totalMoles * fb, acidMoles: scene.totalMoles * (1 - fb) };
}

// The stock volume that brings a scene to a target pH, allowing for the stock's own volume
function stockVolumeFor(scene, pH, stockMolar, sign) {
  let added = 0;
  for (let i = 0; i < 10; i++) {
    const volume = scene.volume + added;
    const needed = chargeForPH(pH, scene.totalMoles / volume, 10 ** -scene.pKa) * volume;
    added = (needed - scene.netBase) * sign / stockMolar;
  }
  return added;
}

// Hard Mode states amounts in whichever units it draws, so they have to be converted.
const concText = (molar, rand) => (rand() < 0.5 ? `${formatNumber(molar * 1e3)} mM` : `${formatNumber(molar)} M`);
const volumeText = (litres, rand) => (rand() < 0.5 ? `${formatNumber(litres * 1e3)} mL` : `${formatNumber(litres)} L`);

// A stock volume asked for in µL when that reads better than a fraction of a mL
function stockVolumeUnit(litres, rand) {
  return litres < 1e-3 || rand() < 0.25 ? { unit: 'µL', factor: 1e6 } : { unit: 'mL', factor: 1e3 };
}

const CONCENTRATIONS = [0.025, 0.05, 0.1, 0.2];
const VOLUMES = [0.05, 0.1, 0.2, 0.25, 0.5];
const STOCKS = [0.5, 1, 2, 5];

const QUESTION_BUILDERS = {
  hendersonHasselbalch(rand) {
    const b = quizBuffer(rand);
    if (rand() < 0.5) {
      // pH from the ratio
      const acidMM = pick([10, 20, 25, 40, 50], rand), ratio = pick([0.1, 0.2, 0.25, 0.5, 2, 4, 5, 10], rand);
      const baseMM = acidMM * ratio;
      const pH = b.pKa + Math.log10(ratio);
      return {
        type: 'hendersonHasselbalch', title: 'Henderson–Hasselbalch',
        prompt: `${describeBuffer(b)} A solution has [${b.base}] = ${formatNumber(baseMM)} mM and [${b.acid}] = ${formatNumber(acidMM)} mM. What is its pH?`,
        items: [pHItem('pH', 'pH', pH)],
        hint: HH_HINT,
        explanation: `pH = ${b.pKa.toFixed(2)} + log(${formatNumber(baseMM)}/${formatNumber(acidMM)}) = ${pH.toFixed(2)}.`,
        scene: sceneAtPH(b, (acidMM + baseMM) / 1e3, 0.1, pH),
      };
    }
    // The ratio from the pH. The solution stays at pH = pKa so that the image doesn't give it away.
    const delta = pick([-1, -0.7, -0.5, -0.3, 0.3, 0.5, 0.7, 1], rand);
    const pH = Number((b.pKa + delta).toFixed(2)), ratio = 10 ** (pH - b.pKa);
    return {
      type: 'hendersonHasselbalch', title: 'Henderson–Hasselbalch',
      prompt: `${describeBuffer(b)} At pH ${pH.toFixed(2)}, what is the ratio [${b.base}]/[${b.acid}]?`,
      items: [numberItem('ratio', `[${b.base}]/[${b.acid}]`, '', ratio, CALCULATED_TOLERANCE)],
      hint: HH_HINT,
      explanation: `Ratio = 10^(${pH.toFixed(2)} − ${b.pKa.toFixed(2)}) = ${formatNumber(ratio, 3)}.`,
      scene: sceneAtPH(b, 0.05, 0.1, b.pKa),
    };
  },

  amounts(rand) {
    const b = quizBuffer(rand);
    const concMM = pick([10, 20, 25, 50, 100], rand), volumeML = pick([50, 100, 200, 250, 500], rand);
    const pH = Number((b.pKa + pick([-0.7, -0.5, -0.3, 0.3, 0.5, 0.7], rand)).toFixed(2));
    const fb = baseFraction(10 ** -pH, 10 ** -b.pKa);
    const asMoles = rand() < 0.5;
    const total = asMoles ? concMM * volumeML / 1e3 : concMM;
    const unit = asMoles ? 'mmol' : 'mM';
    const noun = asMoles ? 'moles' : 'concentration';
    return {
      type: 'amounts', title: 'Amounts of each form',
      prompt: `${describeBuffer(b)} You have ${volumeML} mL of ${concMM} mM buffer at pH ${pH.toFixed(2)}. Find the ${noun} of each form.`,
      items: [
        numberItem('acid', b.acid, unit, total * (1 - fb), CALCULATED_TOLERANCE),
        numberItem('base', b.base, unit, total * fb, CALCULATED_TOLERANCE),
      ],
      hint: `${HH_HINT} The two forms add up to ${formatNumber(total)} ${unit}.`,
      explanation: `The ratio is ${formatNumber(fb / (1 - fb), 3)}, so ${formatNumber(fb * 100, 3)}% is ${b.base}: ${formatNumber(total * fb, 3)} ${unit} ${b.base} and ${formatNumber(total * (1 - fb), 3)} ${unit} ${b.acid}.`,
      scene: sceneAtPH(b, concMM / 1e3, volumeML / 1e3, pH),
    };
  },

  chooseBuffer(rand) {
    // Three buffers far enough apart that one is clearly closest to the target
    const keys = shuffled(['acetate', 'mes', 'mops', 'tris'], rand).slice(0, 3);
    const answerKey = pick(keys, rand), answer = BUFFERS[answerKey];
    const target = Number((answer.pKa + pick([-0.2, -0.1, 0, 0.1, 0.2], rand)).toFixed(1));
    const label = key => `${BUFFERS[key].name} (pKa ${BUFFERS[key].pKa.toFixed(2)})`;
    const check = BUFFERS[pick(keys, rand)];
    const inRange = rand() < 0.5;
    const testPH = Number((check.pKa + (rand() < 0.5 ? -1 : 1) * (inRange ? pick([0.4, 0.6, 0.8], rand) : pick([1.4, 1.7, 2], rand))).toFixed(1));
    const options = keys.map(label);
    return {
      type: 'chooseBuffer', title: 'Choose a buffer',
      prompt: `You need a buffer at pH ${target.toFixed(1)}.`,
      items: [
        choiceItem('best', 'Which of these buffers is the best choice?', options, label(answerKey)),
        choiceItem('range', `Is pH ${testPH.toFixed(1)} within the useful range of ${check.name} (pKa ${check.pKa.toFixed(2)})?`, ['Yes', 'No'], inRange ? 'Yes' : 'No'),
      ],
      hint: 'A buffer works best near its pKa, and its useful range is about pKa ± 1.',
      explanation: `${answer.name} has the pKa closest to ${target.toFixed(1)}. The useful range of ${check.name} is pH ${(check.pKa - 1).toFixed(2)} to ${(check.pKa + 1).toFixed(2)}.`,
      scene: sceneAtPH({ key: keys[0], pKa: BUFFERS[keys[0]].pKa }, 0.05, 0.1, BUFFERS[keys[0]].pKa),
    };
  },

  predominantForm(rand) {
    const b = quizBuffer(rand);
    const delta = pick([-2, -1.5, -1, -0.5, -0.2, 0, 0, 0.2, 0.5, 1, 1.5, 2], rand);
    const pH = Number((b.pKa + delta).toFixed(2));
    const equal = 'Equal amounts of each';
    const answer = delta === 0 ? equal : delta > 0 ? b.base : b.acid;
    const why = delta === 0 ? 'At pH = pKa, the two forms are equal.'
      : delta > 0 ? `The pH is above the pKa, so the base form, ${b.base}, predominates.`
        : `The pH is below the pKa, so the acid form, ${b.acid}, predominates.`;
    return {
      type: 'predominantForm', title: 'Which form predominates?',
      prompt: `${describeBuffer(b)} The solution here starts at pH = pKa.`,
      items: [choiceItem('form', `Which form would be present in the greater amount at pH ${pH.toFixed(2)}?`, [b.acid, b.base, equal], answer)],
      hint: 'Compare the pH with the pKa.',
      explanation: why,
      scene: sceneAtPH(b, 0.05, 0.1, b.pKa),
    };
  },

  phAfterAddition(rand) {
    for (;;) {
      const b = quizBuffer(rand);
      const conc = pick(CONCENTRATIONS, rand), volume = pick(VOLUMES, rand), stock = pick(STOCKS, rand);
      const startPH = Number((b.pKa + pick([-0.3, 0, 0.3], rand)).toFixed(2));
      const scene = sceneAtPH(b, conc, volume, startPH);
      const startFb = baseFraction(10 ** -startPH, 10 ** -b.pKa);
      const addBase = rand() < 0.5;
      // Aim for a final split well inside the buffering region, in a round stock volume
      const aimed = conc * volume * pick([0.1, 0.15, 0.2, 0.25], rand);
      const added = Number((aimed / stock).toPrecision(2));
      const moles = stock * added;
      const result = afterAddition(scene, addBase ? moles : -moles, added);
      const finalFb = result.baseMoles / scene.totalMoles;
      if (finalFb < 0.15 || finalFb > 0.85) continue;
      const reagent = addBase ? 'NaOH' : 'HCl';
      const addedText = added < 1e-3 ? `${formatNumber(added * 1e6)} µL` : `${formatNumber(added * 1e3)} mL`;
      return {
        type: 'phAfterAddition', title: 'pH after an addition',
        prompt: `${describeBuffer(b)} You have ${volumeText(volume, rand)} of ${concText(conc, rand)} buffer at pH ${startPH.toFixed(2)}, and add ${addedText} of ${formatNumber(stock)} M ${reagent}. Find the amounts after the addition, and the final pH.`,
        items: [
          numberItem('added', `${reagent} added`, 'mmol', moles * 1e3, CALCULATED_TOLERANCE),
          numberItem('acid', b.acid, 'mmol', result.acidMoles * 1e3, CALCULATED_TOLERANCE),
          numberItem('base', b.base, 'mmol', result.baseMoles * 1e3, CALCULATED_TOLERANCE),
          pHItem('pH', 'Final pH', result.pH),
        ],
        hint: NEUTRALIZE_HINT,
        explanation: `${formatNumber(moles * 1e3, 3)} mmol of ${reagent} takes the buffer from ${formatNumber(scene.totalMoles * (1 - startFb) * 1e3, 3)} mmol ${b.acid} and ${formatNumber(scene.totalMoles * startFb * 1e3, 3)} mmol ${b.base} to ${formatNumber(result.acidMoles * 1e3, 3)} and ${formatNumber(result.baseMoles * 1e3, 3)} mmol, so pH = ${result.pH.toFixed(2)}.`,
        scene,
      };
    }
  },

  amountToReachPH(rand) {
    const b = quizBuffer(rand);
    const conc = pick(CONCENTRATIONS, rand), volume = pick(VOLUMES, rand), stock = pick(STOCKS, rand);
    const startPH = Number((b.pKa + pick([-0.3, 0, 0.3], rand)).toFixed(2));
    const change = pick([-0.6, -0.4, 0.4, 0.6], rand);
    const targetPH = Number((startPH + change).toFixed(2));
    const scene = sceneAtPH(b, conc, volume, startPH);
    const addBase = change > 0, reagent = addBase ? 'NaOH' : 'HCl';
    const added = stockVolumeFor(scene, targetPH, stock, addBase ? 1 : -1);
    const { unit, factor } = stockVolumeUnit(added, rand);
    const moles = stock * added;
    return {
      type: 'amountToReachPH', title: 'Amount to reach a pH',
      prompt: `${describeBuffer(b)} You have ${volumeText(volume, rand)} of ${concText(conc, rand)} buffer at pH ${startPH.toFixed(2)}. What volume of ${formatNumber(stock)} M ${reagent} brings it to pH ${targetPH.toFixed(2)}?`,
      items: [numberItem('volume', `Volume of ${formatNumber(stock)} M ${reagent}`, unit, added * factor, STOCK_VOLUME_TOLERANCE)],
      hint: NEUTRALIZE_HINT,
      explanation: `Moving from pH ${startPH.toFixed(2)} to ${targetPH.toFixed(2)} takes about ${formatNumber(moles * 1e3, 3)} mmol of ${reagent}, which is ${formatNumber(added * factor, 3)} ${unit} of ${formatNumber(stock)} M stock.`,
      scene,
    };
  },

  preparingBuffer(rand) {
    const b = quizBuffer(rand);
    const conc = pick(CONCENTRATIONS, rand), volume = pick(VOLUMES, rand), stock = pick(STOCKS, rand);
    const targetPH = Number((b.pKa + pick([-0.5, -0.3, 0, 0.3, 0.5], rand)).toFixed(2));
    const fromAcid = rand() < 0.5;
    const form = fromAcid ? b.acid : b.base, reagent = fromAcid ? 'NaOH' : 'HCl';
    const scene = { buffer: b.key, pKa: b.pKa, volume, totalMoles: conc * volume, netBase: fromAcid ? 0 : conc * volume };
    const added = stockVolumeFor(scene, targetPH, stock, fromAcid ? 1 : -1);
    const { unit, factor } = stockVolumeUnit(added, rand);
    const fb = baseFraction(10 ** -targetPH, 10 ** -b.pKa);
    const converted = conc * volume * (fromAcid ? fb : 1 - fb);
    return {
      type: 'preparingBuffer', title: 'Preparing a buffer',
      prompt: `${describeBuffer(b)} You have ${volumeText(volume, rand)} of ${concText(conc, rand)} solution, entirely as ${form}. What volume of ${formatNumber(stock)} M ${reagent} makes a buffer at pH ${targetPH.toFixed(2)}?`,
      items: [numberItem('volume', `Volume of ${formatNumber(stock)} M ${reagent}`, unit, added * factor, STOCK_VOLUME_TOLERANCE)],
      hint: `Find what fraction of the buffer must be converted from ${form}. ${NEUTRALIZE_HINT}`,
      explanation: `At pH ${targetPH.toFixed(2)}, ${formatNumber(fb * 100, 3)}% is ${b.base}, so ${formatNumber(converted * 1e3, 3)} mmol of ${form} must be converted. That is ${formatNumber(added * factor, 3)} ${unit} of ${formatNumber(stock)} M ${reagent}.`,
      scene,
    };
  },
};

// Every type in the mode at least once, with random extras up to the set's length, in random order.
function buildQuizSet(mode, rand = Math.random) {
  const types = [...QUIZ_TYPES[mode]];
  while (types.length < QUIZ_LENGTH) types.push(pick(QUIZ_TYPES[mode], rand));
  return shuffled(types, rand).map(type => QUESTION_BUILDERS[type](rand));
}

// Accepts "0.5", "2.5e-3", "2.5 x 10^-3" and "2.50 × 10⁻³".
function parseAnswer(text) {
  const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  const t = String(text).replace(/\s+/g, '').replace(/[−–]/g, '-')
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, ch => SUP.indexOf(ch)).replace(/⁻/g, '-');
  if (t === '') return NaN;
  const sci = t.match(/^([+-]?(?:\d+\.?\d*|\.\d+))[xX×*]10\^?([+-]?\d+)$/);
  return sci ? Number(`${sci[1]}e${sci[2]}`) : Number(t);
}

function itemIsRight(item, value) {
  if (item.kind === 'choice') return value === item.answer;
  const answer = parseAnswer(value);
  if (!Number.isFinite(answer)) return false;
  const allowed = item.tolerancePH ?? item.tolerance * Math.abs(item.truth);
  return Math.abs(answer - item.truth) <= allowed * (1 + 1e-9);
}

// values holds each item's typed text or chosen option. A blank part is unmarked, and not yet right.
function gradeQuestion(question, values) {
  const results = {};
  for (const item of question.items) {
    const value = values[item.key];
    results[item.key] = value === undefined || value === null || String(value).trim() === '' ? null : itemIsRight(item, value);
  }
  return { results, correct: Object.values(results).every(mark => mark === true) };
}

// 1 point on the first try and ½ on any later one. Showing the answer earns nothing.
function quizCredit(attempt, correct) {
  if (!correct) return 0;
  return attempt === 1 ? 1 : 0.5;
}

function answerText(item) {
  if (item.kind === 'choice') return item.label.endsWith('?') ? item.answer : `${item.label}: ${item.answer}`;
  if (item.tolerancePH !== undefined) return `${item.label} = ${item.truth.toFixed(2)}`;
  return `${item.label} = ${formatNumber(item.truth, 3)}${item.unit ? ` ${item.unit}` : ''}`;
}

const correctAnswerText = question => question.items.map(answerText).join('; ');

// ═══════════════════════════════════════════════════════════════
//  CONTAINERS
// ═══════════════════════════════════════════════════════════════
// profile: [y, half width] of the inner wall from top to bottom, around x = 150.
// fillTop and fillBottom are the y of the capacity mark and of the empty level.
const CX = 150;
const VESSELS = [
  { key: 'micro', label: '1.5 mL microcentrifuge tube', capacity: 1.5, marks: [0.5, 1, 1.5],
    profile: [[52, 46], [230, 38], [300, 10], [316, 3], [318, 0]], fillTop: 74, fillBottom: 318,
    extra: '<rect x="98" y="38" width="104" height="14" rx="4" fill="#FFFFFF" stroke="#685C53" stroke-width="2"/><path d="M102,38 Q84,14 118,12 L150,12" fill="none" stroke="#685C53" stroke-width="2"/>' },
  { key: 'conical15', label: '15 mL conical tube', capacity: 15, marks: [5, 10, 15],
    profile: [[40, 34], [262, 34], [310, 6], [318, 0]], fillTop: 62, fillBottom: 318,
    extra: '<rect x="112" y="16" width="76" height="24" rx="4" fill="#685C53"/>' },
  { key: 'conical50', label: '50 mL conical tube', capacity: 50, marks: [10, 20, 30, 40, 50],
    profile: [[40, 54], [266, 54], [310, 8], [318, 0]], fillTop: 70, fillBottom: 318,
    extra: '<rect x="92" y="16" width="116" height="24" rx="4" fill="#685C53"/>' },
  { key: 'beaker', label: '250 mL beaker', capacity: 250, marks: [50, 100, 150, 200, 250],
    profile: [[44, 100], [312, 96], [318, 90]], fillTop: 84, fillBottom: 318,
    extra: '<path d="M50,44 Q40,36 34,34" fill="none" stroke="#685C53" stroke-width="2.5"/>' },
  { key: 'flask1', label: '1 L Erlenmeyer flask', capacity: 1000, marks: [250, 500, 750, 1000],
    profile: [[26, 28], [96, 28], [300, 112], [314, 118], [318, 110]], fillTop: 106, fillBottom: 318,
    extra: '<rect x="116" y="20" width="68" height="8" rx="3" fill="none" stroke="#685C53" stroke-width="2.5"/>' },
  { key: 'flask2', label: '2 L Erlenmeyer flask', capacity: 2000, marks: [500, 1000, 1500, 2000],
    profile: [[18, 24], [84, 24], [300, 130], [314, 138], [318, 128]], fillTop: 92, fillBottom: 318,
    extra: '<rect x="120" y="12" width="60" height="8" rx="3" fill="none" stroke="#685C53" stroke-width="2.5"/>' },
];

const vesselFor = millilitres => VESSELS.find(v => millilitres <= v.capacity + 1e-9) ?? VESSELS.at(-1);

function halfWidthAt(vessel, y) {
  const p = vessel.profile;
  if (y <= p[0][0]) return p[0][1];
  for (let i = 1; i < p.length; i++) {
    if (y <= p[i][0]) {
      const t = (y - p[i - 1][0]) / (p[i][0] - p[i - 1][0]);
      return p[i - 1][1] + t * (p[i][1] - p[i - 1][1]);
    }
  }
  return p.at(-1)[1];
}

const levelY = (vessel, fraction) => vessel.fillBottom - fraction * (vessel.fillBottom - vessel.fillTop);

function vesselPath(vessel) {
  const left = vessel.profile.map(([y, w]) => `${CX - w},${y}`);
  const right = [...vessel.profile].reverse().map(([y, w]) => `${CX + w},${y}`);
  return `M${[...left, ...right].join(' L')}`;
}

function vesselMarkup(vessel) {
  const marks = vessel.marks.map(mark => {
    const y = levelY(vessel, mark / vessel.capacity), x = CX - halfWidthAt(vessel, y);
    const isTop = mark === vessel.capacity;
    return `<line x1="${x + 1}" y1="${y}" x2="${x + (isTop ? 16 : 11)}" y2="${y}" stroke="#000000" stroke-width="1.3"/>` +
      `<text x="${x + 19}" y="${y + 3.5}" font-size="10.5" fill="#000000" font-family="Segoe UI, Arial, sans-serif">${mark}${isTop ? ' mL' : ''}</text>`;
  }).join('');
  return `<path d="${vesselPath(vessel)}" fill="none" stroke="#685C53" stroke-width="2.5" stroke-linejoin="round"/>${marks}${vessel.extra}`;
}

let shownVessel = null;
let shownFraction = 0;    // the level on screen, easing toward the true one

function targetFraction() {
  return state.volume * 1e3 / vesselFor(state.volume * 1e3).capacity;
}

function updateVessel() {
  const vessel = vesselFor(state.volume * 1e3);
  if (vessel !== shownVessel) {
    // Carry the same volume over, so the level eases from where it was in the new container
    const shownMl = shownVessel ? shownFraction * shownVessel.capacity : state.volume * 1e3;
    shownVessel = vessel;
    shownFraction = shownMl / vessel.capacity;
    const body = document.getElementById('vessel-body');
    body.innerHTML = vesselMarkup(vessel);
    document.getElementById('vessel-clip-path').setAttribute('d', `${vesselPath(vessel)} Z`);
    body.classList.remove('swap');
    void body.getBoundingClientRect();     // restarts the fade
    body.classList.add('swap');
    seedParticlePositions();
  }
  if (reduceMotion) shownFraction = targetFraction();
  document.getElementById('vessel-label').textContent = vessel.label;
  placeLiquid();
}

function placeLiquid() {
  const y = levelY(shownVessel, shownFraction);
  const liquid = document.getElementById('liquid');
  liquid.setAttribute('y', y);
  liquid.setAttribute('height', Math.max(0, 330 - y));
}

// ═══════════════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════════════
// Each particle stands for a fixed number of moles, so the count follows the moles and the
// crowding follows the concentration. Dilution changes neither the moles nor the count.
const SVG_NS = 'http://www.w3.org/2000/svg';
const MIN_PARTICLES = 10, MAX_PARTICLES = 40, IDEAL_PARTICLES = 25;
const PARTICLE_SCALE = 0.72;
const particles = [];     // { u, v, du, dv, isBase, el, use }
let particleScale = null; // mol per particle

// The 1, 2 or 5 × 10ⁿ mol per particle that gives closest to the ideal count
function chooseScale(moles) {
  const decade = Math.floor(Math.log10(moles / IDEAL_PARTICLES));
  let best = null;
  for (const e of [decade - 1, decade, decade + 1]) {
    for (const m of [1, 2, 5]) {
      const scale = m * 10 ** e;
      if (best === null || Math.abs(moles / scale - IDEAL_PARTICLES) < Math.abs(moles / best - IDEAL_PARTICLES)) best = scale;
    }
  }
  return best;
}

function particleCount() {
  const count = particleScale ? Math.round(state.totalMoles / particleScale) : 0;
  if (count < MIN_PARTICLES || count > MAX_PARTICLES) particleScale = chooseScale(state.totalMoles);
  return Math.round(state.totalMoles / particleScale);
}

// A place in the liquid, weighted by the container's width so that density stays even
function randomPosition(p) {
  for (let tries = 0; tries < 40; tries++) {
    p.v = 0.03 + Math.random() * 0.94;
    const y = levelY(shownVessel, targetFraction() * p.v);
    if (Math.random() * 140 <= halfWidthAt(shownVessel, y)) break;
  }
  p.u = (Math.random() * 2 - 1);
}

function seedParticlePositions() {
  for (const p of particles) randomPosition(p);
}

function makeParticle(isBase) {
  const el = document.createElementNS(SVG_NS, 'g');
  const use = document.createElementNS(SVG_NS, 'use');
  const ring = document.createElementNS(SVG_NS, 'circle');
  ring.setAttribute('class', 'flash-ring');
  ring.setAttribute('r', 14);
  el.appendChild(use);
  el.appendChild(ring);
  document.getElementById('particles').appendChild(el);
  const p = { u: 0, v: 0, du: 0, dv: 0, isBase, el, use };
  setParticleForm(p, isBase);
  randomPosition(p);
  return p;
}

function setParticleForm(p, isBase) {
  p.isBase = isBase;
  p.use.setAttribute('href', isBase ? '#glyph-base' : '#glyph-acid');
}

let flashTimer = null;

// Brings the particles to the current count and split. flash marks the ones that changed form.
function syncParticles(flash = false) {
  const total = particleCount(), { fb } = composition();
  while (particles.length > total) particles.pop().el.remove();
  while (particles.length < total) particles.push(makeParticle(false));

  const targetBase = Math.round(total * fb);
  let difference = targetBase - particles.filter(p => p.isBase).length;
  const changed = [];
  for (const p of particles) {
    if (difference > 0 && !p.isBase) { setParticleForm(p, true); changed.push(p); difference--; }
    else if (difference < 0 && p.isBase) { setParticleForm(p, false); changed.push(p); difference++; }
  }
  if (flash && changed.length) {
    for (const p of particles) p.el.classList.remove('conv');
    void document.getElementById('particles').getBoundingClientRect();    // restarts the pulse
    for (const p of changed) p.el.classList.add('conv');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { for (const p of particles) p.el.classList.remove('conv'); }, 1200);
  }
  lastFlashed = flash ? changed.length : 0;
  placeParticles();
}
let lastFlashed = 0;

function placeParticles() {
  if (!shownVessel) return;
  for (const p of particles) {
    const y = levelY(shownVessel, shownFraction * p.v);
    const x = CX + p.u * halfWidthAt(shownVessel, y) * 0.86;
    p.el.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${PARTICLE_SCALE})`);
  }
}

// ── Glyphs ─────────────────────────────────────────────────────
function siteMarkup(buffer, isBase) {
  const { siteX: x, siteY: y } = buffer;
  if (isBase) {
    return `<circle cx="${x}" cy="${y}" r="4.6" fill="#FFFFFF" stroke="#685C53" stroke-width="1.5"/>` +
      (buffer.baseCharge ? `<text x="${x}" y="${y + 3.3}" font-size="9" font-weight="700" text-anchor="middle" fill="#000000">${buffer.baseCharge}</text>` : '');
  }
  return `<circle cx="${x}" cy="${y}" r="5" fill="#C8102E"/><text x="${x}" y="${y + 2.8}" font-size="7.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">H</text>`;
}

function glyphMarkup(buffer, isBase) {
  if (!buffer.core) {
    return isBase
      ? '<circle r="6.5" fill="#685C53"/><text y="3.2" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">−</text>'
      : '<circle r="6.5" fill="#C8102E"/><text y="3" font-size="8.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">H</text>';
  }
  return `<path d="${buffer.core}" fill="none" stroke="#404040" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>${siteMarkup(buffer, isBase)}`;
}

function buildGlyphs() {
  const buffer = BUFFERS[state.buffer];
  document.getElementById('glyph-defs').innerHTML =
    `<g id="glyph-acid" font-family="Segoe UI, Arial, sans-serif">${glyphMarkup(buffer, false)}</g>` +
    `<g id="glyph-base" font-family="Segoe UI, Arial, sans-serif">${glyphMarkup(buffer, true)}</g>`;
  const entry = (isBase, name, site) =>
    `<svg viewBox="-20 -12 40 24" aria-hidden="true" font-family="Segoe UI, Arial, sans-serif">${glyphMarkup(buffer, isBase)}</svg>${name}${site ? ` (${site})` : ''}`;
  document.getElementById('legend-acid').innerHTML = entry(false, buffer.acid, buffer.acidSite);
  document.getElementById('legend-base').innerHTML = entry(true, buffer.base, buffer.baseSite);
}

// ── Motion ─────────────────────────────────────────────────────
function stepParticles() {
  for (const p of particles) {
    p.du = p.du * 0.95 + (Math.random() - 0.5) * 0.0016;
    p.dv = p.dv * 0.95 + (Math.random() - 0.5) * 0.0012;
    p.u += p.du;
    p.v += p.dv;
    if (Math.abs(p.u) > 1) { p.u = Math.sign(p.u); p.du = -p.du; }
    if (p.v < 0.03) { p.v = 0.03; p.dv = -p.dv; }
    if (p.v > 0.97) { p.v = 0.97; p.dv = -p.dv; }
  }
}

function animate() {
  stepParticles();
  const target = targetFraction();
  if (Math.abs(target - shownFraction) > 1e-4) {
    shownFraction += (target - shownFraction) * 0.12;
    placeLiquid();
  }
  placeParticles();
  requestAnimationFrame(animate);
}

// ═══════════════════════════════════════════════════════════════
//  TITRATION CURVE
// ═══════════════════════════════════════════════════════════════
const curveCanvas = document.getElementById('curve');
const cc = curveCanvas.getContext('2d');
let CW = 620, CH = 400;
const PLOT = { left: 48, right: 16, top: 16, bottom: 44 };
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function sizeCurve() {
  CW = Math.max(280, Math.round(curveCanvas.getBoundingClientRect().width));
  CH = Math.max(280, Math.round(CW * 0.645));
  curveCanvas.width = CW * dpr;
  curveCanvas.height = CH * dpr;
}

let hoverEq = null;

function curveRange() {
  const eq = equivalents(), pH = currentPH();
  return {
    xMin: Math.min(0, eq - 0.1),
    xMax: Math.max(1.2, eq + 0.1),
    yMin: Math.min(0, Math.floor(pH - 0.5)),
    yMax: Math.max(14, Math.ceil(pH + 0.5)),
  };
}

function drawCurve() {
  const range = curveRange(), { xMin, xMax, yMin, yMax } = range;
  const w = CW - PLOT.left - PLOT.right, h = CH - PLOT.top - PLOT.bottom;
  const px = eq => PLOT.left + (eq - xMin) / (xMax - xMin) * w;
  const py = pH => PLOT.top + (yMax - pH) / (yMax - yMin) * h;
  const pKa = state.pKa;

  cc.setTransform(dpr, 0, 0, dpr, 0, 0);
  cc.clearRect(0, 0, CW, CH);
  cc.fillStyle = '#FFFFFF';
  cc.fillRect(0, 0, CW, CH);

  // Buffering region
  const bandTop = py(Math.min(pKa + 1, yMax)), bandBottom = py(Math.max(pKa - 1, yMin));
  cc.fillStyle = 'rgba(255,205,255,0.55)';
  cc.fillRect(PLOT.left, bandTop, w, bandBottom - bandTop);
  cc.fillStyle = '#000000';
  cc.font = '12px "Segoe UI",Arial';
  cc.textAlign = 'left'; cc.textBaseline = 'top';
  cc.fillText('Buffering region (pKa ± 1)', PLOT.left + 6, bandTop + 3);

  // Axes
  cc.strokeStyle = 'rgba(104,92,83,0.3)';
  cc.lineWidth = 1;
  cc.fillStyle = '#000000';
  cc.textAlign = 'right'; cc.textBaseline = 'middle';
  for (let pH = Math.ceil(yMin / 2) * 2; pH <= yMax; pH += 2) {
    cc.beginPath(); cc.moveTo(PLOT.left, py(pH)); cc.lineTo(PLOT.left + w, py(pH)); cc.stroke();
    cc.fillText(String(pH), PLOT.left - 6, py(pH));
  }
  const xStep = xMax - xMin > 2.5 ? Math.ceil((xMax - xMin) / 6) : 0.2;
  cc.textAlign = 'center'; cc.textBaseline = 'top';
  for (let i = Math.ceil(xMin / xStep); i * xStep <= xMax + 1e-9; i++) {
    const eq = i * xStep;
    cc.beginPath(); cc.moveTo(px(eq), PLOT.top); cc.lineTo(px(eq), PLOT.top + h); cc.stroke();
    cc.fillText(String(+eq.toFixed(1)), px(eq), PLOT.top + h + 5);
  }
  cc.strokeStyle = '#685C53';
  cc.lineWidth = 1.5;
  cc.strokeRect(PLOT.left, PLOT.top, w, h);
  cc.font = 'bold 13px "Segoe UI",Arial';
  cc.fillText('Equivalents of OH⁻ added', PLOT.left + w / 2, CH - 20);
  cc.save();
  cc.translate(14, PLOT.top + h / 2); cc.rotate(-Math.PI / 2);
  cc.textBaseline = 'middle';
  cc.fillText('pH', 0, 0);
  cc.restore();

  // pKa guides and dot at the half-equivalence point
  cc.strokeStyle = '#685C53';
  cc.lineWidth = 1;
  cc.setLineDash([5, 4]);
  cc.beginPath();
  cc.moveTo(PLOT.left, py(pKa)); cc.lineTo(px(0.5), py(pKa));
  cc.moveTo(px(0.5), py(pKa)); cc.lineTo(px(0.5), PLOT.top + h);
  cc.stroke();
  cc.setLineDash([]);

  // Curve
  cc.strokeStyle = '#000000';
  cc.lineWidth = 2.5;
  cc.lineJoin = 'round';
  cc.beginPath();
  for (let i = 0; i <= 300; i++) {
    const eq = xMin + i / 300 * (xMax - xMin), y = py(curvePH(eq));
    if (i === 0) cc.moveTo(px(eq), y); else cc.lineTo(px(eq), y);
  }
  cc.stroke();

  cc.fillStyle = '#685C53';
  cc.beginPath(); cc.arc(px(0.5), py(pKa), 5, 0, Math.PI * 2); cc.fill();
  cc.fillStyle = '#000000';
  cc.font = 'bold 12px "Segoe UI",Arial';
  cc.textAlign = 'left'; cc.textBaseline = 'top';
  cc.fillText(`pKa = ${pKa.toFixed(2)}`, px(0.5) + 8, py(pKa) + 6);

  // Hover position
  if (hoverEq !== null) {
    const pH = curvePH(hoverEq);
    cc.strokeStyle = '#000000';
    cc.lineWidth = 1.5;
    cc.fillStyle = '#FFFFFF';
    cc.beginPath(); cc.arc(px(hoverEq), py(pH), 5, 0, Math.PI * 2); cc.fill(); cc.stroke();
  }

  // Current state, which a quiz question keeps to itself
  if (answersHidden()) {
    curveCanvas.setAttribute('aria-label',
      `Titration curve of pH against equivalents of OH⁻, with pKa ${pKa.toFixed(2)} at 0.5 equivalents.`);
    return;
  }
  const eq = equivalents(), pH = currentPH();
  cc.strokeStyle = '#FFFFFF';
  cc.lineWidth = 2;
  cc.fillStyle = '#C8102E';
  cc.beginPath(); cc.arc(px(eq), py(pH), 7, 0, Math.PI * 2); cc.fill(); cc.stroke();

  curveCanvas.setAttribute('aria-label',
    `Titration curve of pH against equivalents of OH⁻. The buffer is at ${eq.toFixed(2)} equivalents and pH ${pH.toFixed(2)}, with pKa ${pKa.toFixed(2)} at 0.5 equivalents.`);
}

function hoverAt(clientX) {
  if (answersHidden()) return;
  const rect = curveCanvas.getBoundingClientRect();
  const x = (clientX - rect.left) * CW / rect.width;
  const { xMin, xMax } = curveRange();
  const w = CW - PLOT.left - PLOT.right;
  if (x < PLOT.left || x > PLOT.left + w) { clearHover(); return; }
  hoverEq = xMin + (x - PLOT.left) / w * (xMax - xMin);
  document.getElementById('curve-readout').textContent =
    `Equivalents of OH⁻: ${hoverEq.toFixed(2)}, pH: ${curvePH(hoverEq).toFixed(2)}`;
  drawCurve();
}

function clearHover() {
  if (hoverEq === null) return;
  hoverEq = null;
  document.getElementById('curve-readout').textContent = 'Hover over or touch the plot to read a point on the curve';
  drawCurve();
}

curveCanvas.addEventListener('pointermove', e => hoverAt(e.clientX));
curveCanvas.addEventListener('pointerdown', e => hoverAt(e.clientX));
curveCanvas.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') clearHover(); });

// ═══════════════════════════════════════════════════════════════
//  RENDERING THE PAGE
// ═══════════════════════════════════════════════════════════════
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const setText = (id, text) => { document.getElementById(id).textContent = text; };

// A number field shows the value unless the student is typing in it
function setInput(id, value) {
  const el = document.getElementById(id);
  if (document.activeElement !== el) el.value = value;
}

const VOL_SLIDER_STEPS = 1000;
const MIN_SLIDER_CONC = 1e-3, MAX_SLIDER_CONC = 1;    // M; the number field takes values beyond these
const sliderToConc = pos => +(MIN_SLIDER_CONC * (MAX_SLIDER_CONC / MIN_SLIDER_CONC) ** (pos / VOL_SLIDER_STEPS)).toPrecision(3);
const concToSlider = molar => Math.max(0, Math.min(VOL_SLIDER_STEPS,
  Math.round(Math.log(molar / MIN_SLIDER_CONC) / Math.log(MAX_SLIDER_CONC / MIN_SLIDER_CONC) * VOL_SLIDER_STEPS)));
const sliderToVolume = pos => +(MIN_VOLUME * (MAX_VOLUME / MIN_VOLUME) ** (pos / VOL_SLIDER_STEPS)).toPrecision(3);
const volumeToSlider = litres => Math.round(Math.log(litres / MIN_VOLUME) / Math.log(MAX_VOLUME / MIN_VOLUME) * VOL_SLIDER_STEPS);

function updateControls() {
  if (quiz.active) return;   // the Buffer panel is away, and its fields shouldn't hold a quiz's answers
  const buffer = BUFFERS[state.buffer], c = composition();
  document.getElementById('buffer-select').value = state.buffer;
  setText('forms-label', `Acid form: ${buffer.acid}, Base form: ${buffer.base}`);
  const note = document.getElementById('buffer-note');
  note.textContent = buffer.note ?? '';
  note.hidden = !buffer.note;
  document.getElementById('pka-input').disabled = !buffer.editablePKa;
  setInput('pka-input', state.pKa.toFixed(2));
  setInput('temp-input', String(state.temperature));
  setInput('temp-slider', String(state.temperature));
  setInput('conc-slider', concToSlider(totalConc()));

  setInput('conc-input', formatPlain(totalConc() * CONC_FACTOR[state.concUnit]));
  const volUnit = document.getElementById('vol-unit').value;
  setInput('vol-input', formatPlain(state.volume * VOL_FACTOR[volUnit]));
  setInput('vol-slider', volumeToSlider(state.volume));
  setInput('ph-slider', Math.max(0, Math.min(14, c.pH)).toFixed(2));
  setInput('ph-input', c.pH.toFixed(2));
}

const formatPlain = x => String(+x.toPrecision(5));

function updateReadout() {
  const buffer = BUFFERS[state.buffer], c = composition();
  const hidden = answersHidden();
  document.getElementById('solution-ph').hidden = hidden;
  document.getElementById('status').hidden = hidden;
  document.getElementById('curve-readout').hidden = hidden;
  setText('readout-ph', hidden ? '' : c.pH.toFixed(2));
  setText('readout-acid-conc', hidden ? '' : formatConc(c.acidConc));
  setText('readout-base-conc', hidden ? '' : formatConc(c.baseConc));

  const distance = Math.abs(c.pH - state.pKa), status = document.getElementById('status');
  if (hidden) {
    status.className = '';
    status.textContent = '';
  } else if (distance <= 1) {
    status.className = 'good';
    status.textContent = 'Good buffering (within pKa ± 1)';
  } else {
    status.className = 'poor';
    status.textContent = `Poor buffering: pH is ${distance.toFixed(2)} units from pKa`;
  }
  document.getElementById('vessel-svg').setAttribute('aria-label',
    `${shownVessel.label} holding ${formatVolume(state.volume)} of ${buffer.name} buffer, with ${particles.filter(p => !p.isBase).length} acid-form and ${particles.filter(p => p.isBase).length} base-form particles.`);
}

function updateHistory() {
  const list = document.getElementById('history');
  list.innerHTML = '';
  for (const entry of state.history) {
    const li = document.createElement('li');
    li.textContent = answersHidden() ? entry.label : `${entry.label}: ${entry.pHChange}`;
    list.appendChild(li);
  }
  document.getElementById('history-empty').hidden = state.history.length > 0;
  document.getElementById('undo-button').disabled = state.history.length === 0;
}

function render(flash = false) {
  updateVessel();
  syncParticles(flash);
  updateControls();
  updateReadout();
  updateHistory();
  drawCurve();
}

// ═══════════════════════════════════════════════════════════════
//  WIRING
// ═══════════════════════════════════════════════════════════════
function showError(id, message) {
  document.getElementById(id).textContent = message ?? '';
}

const numberFrom = id => parseFloat(document.getElementById(id).value);
const litresFrom = (inputId, unitId) => numberFrom(inputId) / VOL_FACTOR[document.getElementById(unitId).value];

document.getElementById('buffer-select').innerHTML =
  Object.entries(BUFFERS).map(([key, b]) => `<option value="${key}">${b.name}</option>`).join('');

document.getElementById('buffer-select').addEventListener('change', e => { showError('buffer-error', setBuffer(e.target.value)); });
document.getElementById('pka-input').addEventListener('change', e => {
  showError('buffer-error', setGenericPKa(parseFloat(e.target.value)));
  updateControls();
});
document.getElementById('temp-input').addEventListener('change', e => {
  showError('buffer-error', setTemperature(parseFloat(e.target.value)));
  updateControls();
});
document.getElementById('temp-slider').addEventListener('input', e => { showError('buffer-error', setTemperature(+e.target.value)); });
document.getElementById('conc-slider').addEventListener('input', e => { showError('buffer-error', setConcentration(sliderToConc(+e.target.value))); });
document.getElementById('conc-input').addEventListener('change', e => {
  showError('buffer-error', setConcentration(parseFloat(e.target.value) / CONC_FACTOR[state.concUnit]));
  updateControls();
});
document.getElementById('conc-unit').addEventListener('change', e => { state.concUnit = e.target.value; render(); });
document.getElementById('vol-input').addEventListener('change', () => {
  showError('buffer-error', setVolume(litresFrom('vol-input', 'vol-unit')));
  updateControls();
});
document.getElementById('vol-unit').addEventListener('change', () => { updateControls(); });
document.getElementById('vol-slider').addEventListener('input', e => { showError('buffer-error', setVolume(sliderToVolume(+e.target.value))); });
document.getElementById('ph-slider').addEventListener('input', e => { showError('buffer-error', setPH(+e.target.value)); });
document.getElementById('ph-input').addEventListener('change', e => {
  showError('buffer-error', setPH(parseFloat(e.target.value)));
  updateControls();
});

function chooseReagent(reagent) {
  state.reagent = reagent;
  for (const [id, name] of [['reagent-hcl', 'HCl'], ['reagent-naoh', 'NaOH']]) {
    const btn = document.getElementById(id);
    btn.classList.toggle('active', name === reagent);
    btn.setAttribute('aria-pressed', String(name === reagent));
  }
}
document.getElementById('reagent-hcl').addEventListener('click', () => chooseReagent('HCl'));
document.getElementById('reagent-naoh').addEventListener('click', () => chooseReagent('NaOH'));
document.getElementById('add-button').addEventListener('click', () => {
  showError('add-error', addStrong(state.reagent, numberFrom('stock-input'), litresFrom('add-vol-input', 'add-vol-unit')));
});
document.getElementById('undo-button').addEventListener('click', undoLast);
document.getElementById('reset').addEventListener('click', reset);

window.addEventListener('resize', () => { sizeCurve(); drawCurve(); });

// ── Quiz Mode ──────────────────────────────────────────────────
function quizItemHtml(item) {
  const id = `quiz-${item.key}`;
  if (item.kind === 'number') {
    const label = item.unit ? `${item.label} (${item.unit})` : item.label;
    return `<div class="quiz-item" data-key="${item.key}"><label for="${id}">${label}</label>` +
      `<input type="text" id="${id}" autocomplete="off" spellcheck="false"></div>`;
  }
  const options = item.options.map((option, i) =>
    `<label class="quiz-option"><input type="radio" name="${id}" value="${i}"><span>${option}</span></label>`).join('');
  return `<fieldset class="quiz-item" data-key="${item.key}"><legend>${item.label}</legend>${options}</fieldset>`;
}

function readQuizValues(question) {
  const values = {};
  for (const item of question.items) {
    if (item.kind === 'number') {
      values[item.key] = document.getElementById(`quiz-${item.key}`).value;
    } else {
      const chosen = document.querySelector(`input[name="quiz-${item.key}"]:checked`);
      values[item.key] = chosen ? item.options[Number(chosen.value)] : null;
    }
  }
  return values;
}

// Every particle may now be a different molecule, worth a different amount.
function redrawSolution() {
  clearHover();
  buildGlyphs();
  for (const p of particles) p.el.remove();
  particles.length = 0;
  particleScale = null;
  render();
}

function showQuizQuestion() {
  const question = quiz.set[quiz.index];
  quiz.attempt = 1;
  quiz.finished = false;
  setText('quiz-progress', `Question ${quiz.index + 1} of ${quiz.set.length}`);
  document.getElementById('quiz-question').innerHTML =
    `<p id="quiz-prompt">${question.prompt}</p>${question.items.map(quizItemHtml).join('')}`;
  document.getElementById('quiz-feedback').innerHTML = '';
  document.getElementById('quiz-buttons').hidden = false;
  document.getElementById('quiz-check').hidden = false;
  document.getElementById('quiz-show').hidden = true;
  document.getElementById('quiz-next').hidden = true;
  document.getElementById('quiz-end-buttons').hidden = true;
  showError('add-error', null);

  // The question's solution, with a clean history
  Object.assign(state, question.scene);
  clearHistory();
  redrawSolution();
  document.getElementById('quiz-question').querySelector('input')?.focus();
}

function markQuizItems(results) {
  document.querySelectorAll('#quiz-question .quiz-item').forEach(el => {
    const mark = results[el.dataset.key];
    el.classList.toggle('correct', mark === true);
    el.classList.toggle('wrong', mark === false);
  });
}

function finishQuizQuestion(question, correct) {
  quiz.credits.push(quizCredit(quiz.attempt, correct));
  quiz.finished = true;
  const verdict = correct
    ? (quiz.attempt === 1 ? '<b>✓ Correct.</b>' : '<b>✓ Correct on a later try</b> (½ point).')
    : `<b>Answer:</b> ${correctAnswerText(question)}.`;
  document.getElementById('quiz-feedback').innerHTML = `${verdict} ${question.explanation}`;
  document.querySelectorAll('#quiz-question input').forEach(input => { input.disabled = true; });
  document.getElementById('quiz-check').hidden = true;
  document.getElementById('quiz-show').hidden = true;
  const next = document.getElementById('quiz-next');
  next.hidden = false;
  next.textContent = quiz.index + 1 < quiz.set.length ? 'Next' : 'See Score';
  render();   // brings back the readouts, curve position and History pH values
  next.focus();
}

// Any part can be left blank. Until everything is right, Check gives a hint and offers the answer.
function checkQuizAnswer() {
  if (quiz.finished) return;
  const question = quiz.set[quiz.index];
  const { results, correct } = gradeQuestion(question, readQuizValues(question));
  markQuizItems(results);
  if (correct) {
    finishQuizQuestion(question, true);
    return;
  }
  quiz.attempt += 1;
  document.getElementById('quiz-show').hidden = false;
  document.getElementById('quiz-feedback').innerHTML = `<b>Hint:</b> ${question.hint}`;
}

function showQuizScore() {
  const total = quiz.credits.reduce((sum, credit) => sum + credit, 0);
  const rows = quiz.set.map((q, i) => `<tr><td>${q.title}</td><td>${quiz.credits[i]}</td></tr>`).join('');
  setText('quiz-progress', 'Finished');
  document.getElementById('quiz-question').innerHTML = '';
  document.getElementById('quiz-buttons').hidden = true;
  document.getElementById('quiz-feedback').innerHTML = `<b>Score: ${total} of ${quiz.set.length}</b><table><tbody>${rows}</tbody></table>`;
  document.getElementById('quiz-end-buttons').hidden = false;
  document.getElementById('quiz-again').focus();
}

function startQuizSet() {
  quiz.set = buildQuizSet(quiz.hard ? 'hard' : 'easy');
  quiz.index = 0;
  quiz.credits = [];
  showQuizQuestion();
}

function syncDifficultyButtons() {
  for (const [id, on] of [['difficulty-easy', !quiz.hard], ['difficulty-hard', quiz.hard]]) {
    const button = document.getElementById(id);
    button.classList.toggle('active', on);
    button.setAttribute('aria-pressed', String(on));
  }
}

function setQuizToggle(on) {
  const toggle = document.getElementById('quiz-toggle');
  toggle.classList.toggle('active', on);
  toggle.setAttribute('aria-pressed', String(on));
}

function startQuiz() {
  quiz.saved = { state: { ...state }, KW };
  quiz.active = true;
  // Questions are worked at 25 °C, so that the listed pKa values hold.
  state.temperature = 25;
  KW = 10 ** -pKwAt(25);
  setQuizToggle(true);
  document.getElementById('quiz-box').hidden = false;
  document.getElementById('difficulty-buttons').hidden = false;
  document.getElementById('buffer-panel').hidden = true;
  document.getElementById('reset').disabled = true;
  syncDifficultyButtons();
  startQuizSet();
}

// Puts the page back as it was before the quiz.
function exitQuiz() {
  quiz.active = false;
  setQuizToggle(false);
  Object.assign(state, quiz.saved.state);
  KW = quiz.saved.KW;
  document.getElementById('quiz-box').hidden = true;
  document.getElementById('difficulty-buttons').hidden = true;
  document.getElementById('buffer-panel').hidden = false;
  document.getElementById('reset').disabled = false;
  showError('add-error', null);
  redrawSolution();
}

document.getElementById('quiz-toggle').addEventListener('click', () => {
  if (quiz.active) exitQuiz(); else startQuiz();
});
document.getElementById('quiz-check').addEventListener('click', checkQuizAnswer);
document.getElementById('quiz-show').addEventListener('click', () => {
  if (!quiz.finished) finishQuizQuestion(quiz.set[quiz.index], false);
});
document.getElementById('quiz-next').addEventListener('click', () => {
  quiz.index += 1;
  if (quiz.index < quiz.set.length) showQuizQuestion(); else showQuizScore();
});
document.getElementById('quiz-again').addEventListener('click', startQuizSet);
document.getElementById('quiz-exit').addEventListener('click', exitQuiz);
for (const [id, hard] of [['difficulty-easy', false], ['difficulty-hard', true]]) {
  // A change starts a new set, since the current questions belong to the other mode.
  document.getElementById(id).addEventListener('click', () => {
    if (quiz.hard === hard) return;
    quiz.hard = hard;
    syncDifficultyButtons();
    startQuizSet();
  });
}
document.getElementById('quiz-question').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.type === 'text') checkQuizAnswer();
});
document.getElementById('quiz-question').addEventListener('input', e => {
  e.target.closest('.quiz-item')?.classList.remove('correct', 'wrong');
});

// ── Init ───────────────────────────────────────────────────────
sizeCurve();
setNetBaseForPH(state.pKa);
buildGlyphs();
render();
if (!reduceMotion) requestAnimationFrame(animate);
</script>
</body>
</html>
