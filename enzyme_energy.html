<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enzyme Energy Diagram</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ut-crimson:  #C8102E;
      --ut-taupe:    #685C53;
      --ut-lavender: #FFCDFF;
      --bg-panel:    #FFF8FF;
      --lavender-edge: #7A3E7A;   /* outlines the lavender, which is too pale to show on white by itself */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #FFFFFF;
      color: #000000;
      line-height: 1.4;
      padding: 16px;
    }
    sub, sup { line-height: 0; }

    :focus-visible { outline: 3px solid var(--ut-crimson); outline-offset: 2px; }

    #page { max-width: 1120px; margin: 0 auto; }

    header { position: relative; text-align: center; margin-bottom: 14px; padding: 0 130px; }
    h1 { color: var(--ut-crimson); font-size: 1.7em; font-weight: 600; margin-bottom: 4px; }
    #subtitle { color: var(--ut-taupe); font-size: 0.92em; }
    #quiz-wrap { position: absolute; top: 4px; right: 0; display: inline-block; cursor: not-allowed; }

    .panel {
      background: var(--bg-panel);
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
      padding: 14px 16px;
    }
    .panel-section-title {
      font-size: 0.75em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ut-crimson);
      margin-bottom: 8px;
    }

    button { font-family: inherit; font-size: 0.88em; }
    button {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--ut-taupe);
      background: #FFFFFF;
      color: var(--ut-taupe);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    button:hover:not(:disabled) { background: var(--ut-lavender); border-color: var(--ut-crimson); color: #000000; }
    button.active { background: #FFCDD2; border-color: var(--ut-crimson); color: #000000; font-weight: 600; }
    button:disabled, input:disabled {
      background: #E4E4E4; border-color: #BFBFBF; color: #404040; cursor: not-allowed;
    }
    #quiz-mode { pointer-events: none; }

    /* ── Controls ── */
    #controls { margin-bottom: 14px; }
    #top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 12px; }
    .top-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .group-label { font-size: 0.82em; font-weight: 600; }
    .segmented { display: inline-flex; flex-wrap: wrap; }
    .segmented button { border-radius: 0; margin-left: -1px; }
    .segmented button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
    .segmented button:last-child { border-radius: 0 6px 6px 0; }

    #slider-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 20px; }
    .slider-column { display: flex; flex-direction: column; gap: 10px; }
    .field label { display: block; font-size: 0.82em; font-weight: 600; margin-bottom: 3px; }
    .field-range { color: var(--ut-taupe); font-weight: 400; }
    .field-row { display: flex; align-items: center; gap: 6px; }
    .field input[type=range] { flex: 1; min-width: 0; accent-color: var(--ut-crimson); cursor: pointer; }
    .field input[type=range]:disabled { accent-color: #828282; background: none; }
    .field input[type=number] {
      width: 62px;
      padding: 4px 6px;
      border: 1px solid var(--ut-taupe);
      border-radius: 6px;
      font: inherit;
      font-size: 0.88em;
      background: #FFFFFF;
    }
    .field input[type=number]:disabled { background: #E4E4E4; border-color: #BFBFBF; color: #404040; }
    .field.off label { color: #404040; }
    .field-unit { font-size: 0.78em; color: var(--ut-taupe); min-width: 18px; }
    .field.off .field-unit, .field.off .field-range { color: #404040; }

    .check { display: inline-flex; align-items: center; gap: 5px; font-size: 0.86em; cursor: pointer; }
    .check input { accent-color: var(--ut-crimson); width: 16px; height: 16px; }
    #clamp-note { font-size: 0.82em; margin-top: 8px; border-left: 3px solid var(--ut-crimson); padding-left: 8px; }

    /* ── Diagram, with the activity plots to its right ── */
    #main-row { display: grid; grid-template-columns: minmax(0, 617fr) minmax(0, 489fr); gap: 14px; align-items: start; }
    #diagram-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 14px; margin-bottom: 6px; }
    #diagram-head .panel-section-title { margin-bottom: 0; }
    #annotations { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-left: auto; }
    #legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.82em; margin-bottom: 6px; }
    .swatch { display: inline-block; width: 30px; height: 0; margin-right: 6px; vertical-align: middle; }
    .swatch.uncat { border-top: 3px dashed var(--ut-taupe); }
    .swatch.cat { border-top: 3px solid var(--ut-crimson); }
    canvas { display: block; width: 100%; border-radius: 8px; background: #FFFFFF; }
    #diagram { height: 336px; touch-action: pan-y; }
    .callout { margin-top: 10px; padding: 8px 10px; background: var(--ut-lavender); border: 1px solid var(--lavender-edge); border-radius: 8px; font-size: 0.88em; }

    #plot-column { display: flex; flex-direction: column; gap: 14px; }
    .plot-canvas { height: 240px; touch-action: pan-y; }
    .small-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 16px; margin-top: 10px; }

    @media (max-width: 1000px) {
      #slider-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #main-row { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 720px) {
      body { padding: 10px; }
      header { padding: 0; }
      #quiz-wrap { position: static; display: inline-block; margin-top: 8px; }
    }
    @media (max-width: 560px) {
      #slider-grid { grid-template-columns: minmax(0, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
<div id="page">

  <header>
    <h1>Enzyme Energy Diagram</h1>
    <p id="subtitle">Compare an uncatalyzed reaction with the enzyme-catalyzed path on a free-energy diagram</p>
    <span id="quiz-wrap" title="Coming soon"><button type="button" id="quiz-mode" disabled>Quiz Mode</button></span>
  </header>

  <section class="panel" id="controls" aria-labelledby="controls-title">
    <h2 class="panel-section-title" id="controls-title">Controls</h2>
    <div id="top-row">
      <div class="top-group">
        <span class="group-label" id="view-label">View</span>
        <div class="segmented" role="group" aria-labelledby="view-label">
          <button type="button" data-view="uncat">Uncatalyzed only</button>
          <button type="button" data-view="cat">Catalyzed only</button>
          <button type="button" data-view="both">Both</button>
        </div>
      </div>
      <div class="top-group">
        <span class="group-label" id="units-label">Units</span>
        <div class="segmented" role="group" aria-labelledby="units-label">
          <button type="button" data-unit="kJ">kJ/mol</button>
          <button type="button" data-unit="kcal">kcal/mol</button>
        </div>
      </div>
      <button type="button" id="reset">Reset to defaults</button>
      <button type="button" id="preset-trap">Show ground-state trap</button>
    </div>

    <div id="slider-grid">
      <div class="slider-column" id="column-overall"></div>
      <div class="slider-column" id="column-enzyme"></div>
      <div class="slider-column" id="column-intermediate"></div>
      <div class="slider-column" id="column-conditions"></div>
    </div>

    <p id="clamp-note" role="status" hidden></p>
  </section>

  <div id="main-row">
    <section class="panel" aria-labelledby="diagram-title">
      <div id="diagram-head">
        <h2 class="panel-section-title" id="diagram-title">Reaction coordinate diagram</h2>
        <div id="annotations">
          <label class="check"><input type="checkbox" id="show-barriers"> ΔG‡ arrows</label>
          <label class="check"><input type="checkbox" id="show-dg"> ΔG arrow</label>
        </div>
      </div>
      <div id="legend">
        <span id="legend-uncat"><span class="swatch uncat"></span>Uncatalyzed</span>
        <span id="legend-cat"><span class="swatch cat"></span>Catalyzed</span>
      </div>
      <canvas id="diagram" role="img"></canvas>
      <p class="callout" id="trap-callout" hidden></p>
    </section>

    <div id="plot-column">
      <section class="panel" aria-labelledby="temp-title">
        <h2 class="panel-section-title" id="temp-title">Temperature</h2>
        <canvas class="plot-canvas" id="temp-plot" role="img"></canvas>
        <div class="small-fields" id="temp-fields"></div>
      </section>
      <section class="panel" aria-labelledby="ph-title">
        <h2 class="panel-section-title" id="ph-title">pH</h2>
        <canvas class="plot-canvas" id="ph-plot" role="img"></canvas>
        <div class="small-fields" id="ph-fields"></div>
      </section>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══ 1. MODEL: NO DOM IN THIS SECTION ═════════════════════════

const R_KJ = 8.314462618e-3;          // kJ/(mol·K)
const KB_OVER_H = 2.083661912e10;     // Boltzmann constant / Planck constant, in 1/(K·s)
const KJ_PER_KCAL = 4.184;
const MIN_TS_GAP = 1;                 // kJ/mol: how far a transition state must stay above its neighbors
const DH_UNFOLD = 400;                // kJ/mol: the enthalpy of unfolding, fixed

// The defaults show optimal catalysis: weak substrate binding and strong transition-state stabilization.
const DEFAULTS = Object.freeze({
  view: 'both', unit: 'kJ',
  dGu: 90, dG: -20, binding: -10, tsStab: 80,
  epG: -30, ts2Height: 35,
  tempC: 37, pH: 7,
  showBarriers: true, showDG: true,
  Tm: 55, pKa1: 6, pKa2: 8.5,
});

const SETTINGS_TRAP = { dGu: 90, dG: -20, binding: -40, tsStab: 50, view: 'both' };

const toKelvin = c => c + 273.15;
const toDisplayEnergy = (kJ, unit) => (unit === 'kcal' ? kJ / KJ_PER_KCAL : kJ);
const fromDisplayEnergy = (value, unit) => (unit === 'kcal' ? value * KJ_PER_KCAL : value);

// Eyring: k = (kB·T/h)·e^(−ΔG‡/RT)
function eyring(barrier, T) {
  return KB_OVER_H * T * Math.exp(-barrier / (R_KJ * T));
}

// Fraction folded = 1/(1 + e^(−ΔG_unf/RT)), with ΔG_unf = ΔH_unf·(1 − T/Tm). T and Tm in kelvin.
function fractionFolded(T, TmK, dHunf = DH_UNFOLD) {
  const dGunf = dHunf * (1 - T / TmK);
  return 1 / (1 + Math.exp(-dGunf / (R_KJ * T)));
}

// A general base (pKa1) must be deprotonated and a general acid (pKa2) protonated.
function phActivity(pH, pKa1, pKa2) {
  return 1 / (1 + Math.pow(10, pKa1 - pH) + Math.pow(10, pH - pKa2));
}

// The uncatalyzed path. S and P set the zero and the end that the catalyzed path shares.
function uncatalyzedStates(s) {
  return [
    { id: 'S',  name: 'S',  kind: 'S',   role: 'min', u: 0,   g: 0 },
    { id: 'S‡', name: 'S‡', kind: 'S‡',  role: 'ts',  u: 0.5, g: s.dGu },
    { id: 'P',  name: 'P',  kind: 'P',   role: 'min', u: 1,   g: s.dG },
  ];
}

// The catalyzed path, E + S → ES → TS1 → EP → TS2 → E + P, with each transition state held above the
// states on either side of it. Returns the states and whichever limits had to be applied.
function catalyzedPath(s) {
  const clamps = [];
  const above = (wanted, name, neighbors) => {
    const floor = Math.max(...neighbors.map(n => n.g)) + MIN_TS_GAP;
    if (wanted >= floor) return wanted;
    clamps.push({ ts: name, below: neighbors.reduce((a, b) => (b.g > a.g ? b : a)).name, gap: MIN_TS_GAP });
    return floor;
  };
  const start = { id: 'E+S', name: 'E + S', kind: 'E+S', role: 'min', u: 0, g: 0 };
  const ES = { id: 'ES', name: 'ES', kind: 'ES', role: 'min', u: 0.15, g: s.binding };
  const EP = { id: 'EP', name: 'EP', kind: 'EP', role: 'min', u: 0.56, g: s.epG };
  const end = { id: 'E+P', name: 'E + P', kind: 'E+P', role: 'min', u: 1, g: s.dG };
  const ts1 = { id: 'TS1', name: 'TS1', kind: 'ES‡', role: 'ts', u: 0.34, g: above(s.dGu - s.tsStab, 'TS1', [ES, EP]) };
  const ts2 = { id: 'TS2', name: 'TS2', kind: 'TS2', role: 'ts', u: 0.77, g: above(s.epG + s.ts2Height, 'TS2', [EP, end]) };
  return { states: [start, ES, ts1, EP, ts2, end], clamps };
}

// Each barrier runs from the lowest state before its transition state. The largest is rate-limiting;
// a tie stays with the earlier step.
function barriersOf(states) {
  const barriers = [];
  let lowest = states[0];
  states.forEach(st => {
    if (st.role === 'ts') barriers.push({ ts: st, from: lowest, barrier: st.g - lowest.g });
    else if (st.g < lowest.g) lowest = st;
  });
  const limiting = barriers.reduce((a, b) => (b.barrier > a.barrier ? b : a));
  return { barriers, limiting };
}

// Smooth curve through the states: every state is a flat point, so each one is a true minimum or
// maximum and the curve never overshoots a state's energy.
function pathValue(states, u) {
  if (u <= states[0].u) return states[0].g;
  for (let i = 1; i < states.length; i++) {
    if (u <= states[i].u) {
      const a = states[i - 1], b = states[i];
      const t = (u - a.u) / (b.u - a.u);
      return a.g + (b.g - a.g) * t * t * (3 - 2 * t);
    }
  }
  return states[states.length - 1].g;
}

// Tighter binding than the default raises the barrier measured from ES above the barrier that the
// same transition state would have with default binding: the ground-state trap.
function isGroundStateTrap(tsG, esG, defaultBinding = DEFAULTS.binding) {
  const fromES = tsG - esG;
  const fromDefault = tsG - Math.min(0, defaultBinding);
  return fromES > fromDefault;
}

const TEMP_MIN = 0, TEMP_MAX = 80, PH_MIN = 4, PH_MAX = 10;

function temperatureCurve(barrier, TmC) {
  const TmK = toKelvin(TmC);
  const pts = [];
  for (let c = TEMP_MIN; c <= TEMP_MAX + 1e-9; c += 0.25) {
    const T = toKelvin(c);
    pts.push({ x: c, raw: eyring(barrier, T) * fractionFolded(T, TmK) });
  }
  const top = pts.reduce((a, b) => (b.raw > a.raw ? b : a));
  pts.forEach(p => { p.y = p.raw / top.raw; });
  return { pts, optimum: top.x };
}

function phCurve(pKa1, pKa2) {
  const pts = [];
  for (let pH = PH_MIN; pH <= PH_MAX + 1e-9; pH += 0.02) pts.push({ x: pH, y: phActivity(pH, pKa1, pKa2) });
  return { pts, optimum: (pKa1 + pKa2) / 2 };
}

// Every number on the page comes from here, so a later quiz mode can hide or test any of them.
function buildModel(s) {
  const uncat = uncatalyzedStates(s);
  const { states: cat, clamps } = catalyzedPath(s);
  const { barriers, limiting } = barriersOf(cat);
  const ts1 = cat.find(st => st.id === 'TS1');
  return {
    uncat, cat, clamps, barriers, limiting, ts1,
    tsGap: s.dGu - limiting.ts.g,                     // transition state to transition state
    dG: s.dG,
    trap: isGroundStateTrap(ts1.g, s.binding),
    temp: temperatureCurve(limiting.barrier, s.Tm),
    ph: phCurve(s.pKa1, s.pKa2),
  };
}

// ── Formatting ──
const withMinus = text => text.replace('-', '−');
const unitLabel = unit => (unit === 'kcal' ? 'kcal/mol' : 'kJ/mol');

function fmtEnergy(kJ, unit) {
  const value = toDisplayEnergy(kJ, unit);
  const text = value.toFixed(1);
  return `${Number(text) === 0 ? '0.0' : withMinus(text)} ${unitLabel(unit)}`;
}


// ═══ 2. PAGE STATE AND CONTROLS ═══════════════════════════════

const $ = id => document.getElementById(id);
let state = { ...DEFAULTS };
let hover = null;
let currentModel = null;

const CRIMSON = '#C8102E', TAUPE = '#685C53', LAVENDER = '#FFCDFF', LAVENDER_EDGE = '#7A3E7A', FONT = "'Segoe UI', Arial, sans-serif";

// Every slider and its paired box. energy: true converts the box to the chosen unit.
const CONTROLS = [
  { key: 'dGu',       label: 'ΔG‡ (uncatalyzed)',    min: 40,  max: 160, step: 1,   energy: true, box: 'column-overall' },
  { key: 'dG',        label: 'ΔG° (overall, S → P)', min: -40, max: 20,  step: 1,   energy: true, box: 'column-overall' },
  { key: 'binding',   label: 'ES binding energy',    min: -40, max: 0,   step: 1,   energy: true, enzyme: true, box: 'column-enzyme' },
  { key: 'tsStab',    label: 'TS stabilization',     min: 0,   max: 110, step: 1,   energy: true, enzyme: true, box: 'column-enzyme' },
  { key: 'epG',       label: 'EP energy (relative to S)', min: -60, max: 10, step: 1, energy: true, enzyme: true, box: 'column-intermediate' },
  { key: 'ts2Height', label: 'TS2 height above EP',  min: 5,   max: 80,  step: 1,   energy: true, enzyme: true, box: 'column-intermediate' },
  { key: 'tempC',     label: 'Temperature',          min: 0,   max: 80,  step: 1,   unit: '°C', box: 'column-conditions' },
  { key: 'pH',        label: 'pH',                   min: 4,   max: 10,  step: 0.1, unit: '', enzyme: true, box: 'column-conditions' },
  { key: 'Tm',        label: 'T<sub>m</sub>',        min: 35,  max: 90,  step: 1,   unit: '°C', enzyme: true, box: 'temp-fields' },
  { key: 'pKa1',      label: 'pK<sub>a1</sub>',      min: PH_MIN, max: PH_MAX, step: 0.1, unit: '', enzyme: true, box: 'ph-fields' },
  { key: 'pKa2',      label: 'pK<sub>a2</sub>',      min: PH_MIN, max: PH_MAX, step: 0.1, unit: '', enzyme: true, box: 'ph-fields' },
];
const PKA_GAP = 0.1;

function buildControls() {
  CONTROLS.forEach(c => {
    const field = document.createElement('div');
    field.className = 'field';
    field.id = `field-${c.key}`;
    field.innerHTML = `<label for="box-${c.key}">${c.label} <span class="field-range"></span></label>
      <div class="field-row">
        <input type="range" id="slider-${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" aria-label="${c.label.replace(/<[^>]+>/g, '')} slider">
        <input type="number" id="box-${c.key}">
        <span class="field-unit"></span>
      </div>`;
    $(c.box).appendChild(field);
    $(`slider-${c.key}`).addEventListener('input', e => setValue(c, Number(e.target.value)));
    $(`box-${c.key}`).addEventListener('change', e => {
      const typed = Number(e.target.value);
      if (e.target.value.trim() === '' || !Number.isFinite(typed)) { render(); return; }
      setValue(c, c.energy ? fromDisplayEnergy(typed, state.unit) : typed);
    });
  });
}

function setValue(control, value) {
  let v = Math.min(control.max, Math.max(control.min, value));
  if (control.key === 'pKa1') v = Math.min(v, state.pKa2 - PKA_GAP);
  if (control.key === 'pKa2') v = Math.max(v, state.pKa1 + PKA_GAP);
  state[control.key] = v;
  render();
}

function wireControls() {
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.view; render(); }));
  document.querySelectorAll('[data-unit]').forEach(b => b.addEventListener('click', () => { state.unit = b.dataset.unit; render(); }));
  $('reset').addEventListener('click', () => { state = { ...DEFAULTS }; render(); });
  $('preset-trap').addEventListener('click', () => { state = { ...state, ...SETTINGS_TRAP }; render(); });
  $('show-barriers').addEventListener('change', e => { state.showBarriers = e.target.checked; render(); });
  $('show-dg').addEventListener('change', e => { state.showDG = e.target.checked; render(); });

  const diagram = $('diagram');
  const track = e => {
    const r = diagram.getBoundingClientRect();
    hover = { x: e.clientX - r.left, y: e.clientY - r.top };
    drawDiagram(currentModel);
  };
  diagram.addEventListener('pointermove', track);
  diagram.addEventListener('pointerdown', track);
  diagram.addEventListener('pointerleave', () => { hover = null; drawDiagram(currentModel); });
  if (window.ResizeObserver) new ResizeObserver(() => { if (currentModel) drawAll(currentModel); }).observe($('page'));
}

function syncControls() {
  const uncatOnly = state.view === 'uncat';
  const unit = state.unit;
  CONTROLS.forEach(c => {
    const field = $(`field-${c.key}`);
    const off = uncatOnly && !!c.enzyme;
    field.classList.toggle('off', off);
    const slider = $(`slider-${c.key}`), box = $(`box-${c.key}`);
    slider.disabled = off;
    box.disabled = off;
    slider.value = state[c.key];
    if (c.energy) {
      box.min = toDisplayEnergy(c.min, unit).toFixed(1);
      box.max = toDisplayEnergy(c.max, unit).toFixed(1);
      box.step = unit === 'kcal' ? 0.1 : c.step;
      box.value = Number(toDisplayEnergy(state[c.key], unit).toFixed(1));
    } else {
      box.min = c.min;
      box.max = c.max;
      box.step = c.step;
      box.value = state[c.key];
    }
    field.querySelector('.field-unit').textContent = c.energy ? unitLabel(unit) : (c.unit || '');
    const low = c.energy ? toDisplayEnergy(c.min, unit) : c.min;
    const high = c.energy ? toDisplayEnergy(c.max, unit) : c.max;
    const round = c.energy && unit === 'kcal' ? 1 : 0;
    field.querySelector('.field-range').textContent = `(${withMinus(low.toFixed(round))} to ${withMinus(high.toFixed(round))})`;
  });

  document.querySelectorAll('[data-view]').forEach(b => {
    const on = b.dataset.view === state.view;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on);
  });
  document.querySelectorAll('[data-unit]').forEach(b => {
    const on = b.dataset.unit === unit;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on);
  });

  $('preset-trap').disabled = uncatOnly;
  $('show-barriers').checked = state.showBarriers;
  $('show-dg').checked = state.showDG;
  $('legend-uncat').hidden = state.view === 'cat';
  $('legend-cat').hidden = uncatOnly;
}

// The notes that go with the diagram
function renderNotes(m) {
  const uncatOnly = state.view === 'uncat';
  const u = state.unit;
  const trap = !uncatOnly && m.trap;
  $('trap-callout').hidden = !trap;
  if (trap) {
    $('trap-callout').textContent = `Ground-state trap: ES is so stable that it sits in a deep well. The barrier from ES is ${fmtEnergy(m.ts1.g - state.binding, u)}, higher than the ${fmtEnergy(m.ts1.g - DEFAULTS.binding, u)} it would be with default binding. Binding the substrate too tightly slows the enzyme.`;
  }
  const note = uncatOnly ? '' : m.clamps
    .map(c => `${c.ts} is held ${fmtEnergy(c.gap, u)} above ${c.below}, because the sliders would put it below.`)
    .join(' ');
  $('clamp-note').hidden = !note;
  $('clamp-note').textContent = note;
}


// ═══ 3. DRAWING ═══════════════════════════════════════════════

function fitCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  return { ctx, W, H };
}

// Text on a pale background, so it stays readable where it crosses a curve.
function textBox(ctx, text, x, y, { align = 'center', color = '#000000', font = `12px ${FONT}`, baseline = 'middle', pad = 2 } = {}) {
  ctx.font = font;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  const w = ctx.measureText(text).width;
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const size = parseInt(font.match(/(\d+)px/)[1], 10);
  const top = baseline === 'middle' ? y - size / 2 - 1 : baseline === 'bottom' ? y - size - 2 : y - 1;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.86)';
  ctx.fillRect(left - pad, top, w + pad * 2, size + 3);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  return w;
}

function verticalArrow(ctx, x, from, to, color, width = 1.5) {
  const dir = to < from ? -1 : 1;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x, from);
  ctx.lineTo(x, to - dir * 5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, to);
  ctx.lineTo(x - 4, to - dir * 7);
  ctx.lineTo(x + 4, to - dir * 7);
  ctx.closePath();
  ctx.fill();
}

function guideLine(ctx, x1, y, x2) {
  ctx.strokeStyle = TAUPE;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y);
  ctx.stroke();
  ctx.setLineDash([]);
}

// ── Schematics: an enzyme with a notch, and a substrate of two joined shapes ──
function drawEnzyme(ctx, x, y, r) {
  // A disc whose active-site notch opens to the right
  const notch = 0.62;
  ctx.beginPath();
  ctx.arc(x, y, r, notch, Math.PI * 2 - notch);
  ctx.lineTo(x + r * 0.28, y);
  ctx.closePath();
  ctx.fillStyle = LAVENDER;
  ctx.strokeStyle = LAVENDER_EDGE;
  ctx.lineWidth = 1.5;
  ctx.fill();
  ctx.stroke();
}

// form: 'S' is two circles, 'S‡' is the same pair stretched with a broken bond, 'P' has one end changed to a square
function drawLigand(ctx, x, y, r, form) {
  const gap = form === 'S‡' ? r * 1.9 : r * 1.25;
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 1.5;
  ctx.setLineDash(form === 'S‡' ? [2, 2] : []);
  ctx.beginPath();
  ctx.moveTo(x - gap / 2, y);
  ctx.lineTo(x + gap / 2, y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = CRIMSON;
  ctx.beginPath();
  ctx.arc(x - gap / 2, y, r * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  if (form === 'P') {
    ctx.fillStyle = TAUPE;
    ctx.fillRect(x + gap / 2 - r * 0.5, y - r * 0.5, r, r);
    ctx.strokeRect(x + gap / 2 - r * 0.5, y - r * 0.5, r, r);
  } else {
    ctx.fillStyle = form === 'S‡' ? '#FFFFFF' : CRIMSON;
    ctx.beginPath();
    ctx.arc(x + gap / 2, y, r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
}

function drawSpecies(ctx, kind, x, y, s) {
  const eR = s, lR = s * 0.42, eX = x - s * 0.55;
  const inNotch = eX + eR * 0.82;
  const free = x + s * 1.15;
  switch (kind) {
    case 'S':   drawLigand(ctx, x, y, lR * 1.2, 'S'); break;
    case 'S‡':  drawLigand(ctx, x, y, lR * 1.2, 'S‡'); break;
    case 'P':   drawLigand(ctx, x, y, lR * 1.2, 'P'); break;
    case 'E+S': drawEnzyme(ctx, eX, y, eR); drawLigand(ctx, free + s * 0.3, y, lR, 'S'); break;
    case 'ES':  drawEnzyme(ctx, eX, y, eR); drawLigand(ctx, inNotch, y, lR, 'S'); break;
    case 'ES‡': drawEnzyme(ctx, eX, y, eR); drawLigand(ctx, inNotch, y, lR, 'S‡'); break;
    case 'EP':  drawEnzyme(ctx, eX, y, eR); drawLigand(ctx, inNotch, y, lR, 'P'); break;
    case 'TS2': drawEnzyme(ctx, eX, y, eR); drawLigand(ctx, inNotch + s * 0.4, y, lR, 'P'); break;
    case 'E+P': drawEnzyme(ctx, eX, y, eR); drawLigand(ctx, free + s * 0.3, y, lR, 'P'); break;
    default: break;
  }
}

// ── The diagram ──
function shownStates(m) {
  const view = state.view;
  if (view === 'uncat') return m.uncat.map(s => ({ ...s, path: 'uncat' }));
  const cat = m.cat.map(s => ({ ...s, path: 'cat' }));
  if (view === 'cat') return cat;
  // In Both, S and E + S are one point, as are P and E + P.
  const joined = cat.map(s => {
    if (s.id === 'E+S') return { ...s, name: 'S or E + S' };
    if (s.id === 'E+P') return { ...s, name: 'P or E + P' };
    return s;
  });
  return [...joined, { ...m.uncat[1], path: 'uncat' }];
}

function diagramScale(m, W, H) {
  const narrow = W < 480;
  const levels = [0, m.dG];
  if (state.view !== 'cat') levels.push(state.dGu);
  if (state.view !== 'uncat') m.cat.forEach(s => levels.push(s.g));
  // The scale moves in steps, so small slider moves show on the curve and not as a rescale.
  const lo = Math.floor(Math.min(...levels) / 20) * 20;
  const hi = Math.max(lo + 40, Math.ceil(Math.max(...levels) / 20) * 20);
  const left = narrow ? 46 : 56, right = W - (narrow ? 44 : 88), top = 8, bottom = H - 26;
  const padTop = 32, padBottom = 42;
  const inner = 10;
  return {
    narrow, lo, hi, left, right, top, bottom,
    x: u => left + inner + u * (right - left - inner * 2),
    y: g => bottom - padBottom - (g - lo) / (hi - lo) * (bottom - top - padTop - padBottom),
  };
}

function drawAxes(ctx, g, H) {
  const unit = state.unit;
  const loD = toDisplayEnergy(g.lo, unit), hiD = toDisplayEnergy(g.hi, unit);
  const span = hiD - loD;
  const steps = unit === 'kcal' ? [5, 10, 20] : [20, 40, 80];
  const step = steps.find(s => span / s <= 7) || steps[steps.length - 1];
  ctx.font = `11px ${FONT}`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let v = Math.ceil(loD / step) * step; v <= hiD + 1e-9; v += step) {
    const y = g.y(fromDisplayEnergy(v, unit));
    ctx.strokeStyle = '#E4E4E4';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(g.left, y);
    ctx.lineTo(g.right, y);
    ctx.stroke();
    ctx.fillStyle = '#000000';
    ctx.fillText(withMinus(String(v)), g.left - 5, y);
  }
  ctx.strokeStyle = TAUPE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(g.left, g.top);
  ctx.lineTo(g.left, g.bottom);
  ctx.lineTo(g.right, g.bottom);
  ctx.stroke();

  ctx.fillStyle = '#000000';
  ctx.font = `600 12px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Reaction coordinate', (g.left + g.right) / 2, H - 8);
  ctx.save();
  ctx.translate(12, (g.top + g.bottom) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(`G (${unitLabel(unit)})`, 0, 0);
  ctx.restore();
}

function drawPath(ctx, g, states, color, width, dash) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash(dash);
  ctx.beginPath();
  for (let i = 0; i <= 300; i++) {
    const u = i / 300;
    const px = g.x(u), py = g.y(pathValue(states, u));
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawBarrierArrows(ctx, g, m) {
  const unit = state.unit;
  const view = state.view;
  const uncatTS = m.uncat[1];
  const peakX = g.x(uncatTS.u);
  const small = `600 11px ${FONT}`;
  if (view !== 'cat') {
    const x = peakX - (g.narrow ? 16 : 24);
    guideLine(ctx, g.x(0), g.y(0), x);
    verticalArrow(ctx, x, g.y(0), g.y(state.dGu), TAUPE);
    // TS1 sits to the left of this arrow, so with both paths shown the label goes on the right and higher up.
    const rightSide = view === 'both';
    const align = rightSide ? 'left' : 'right';
    const tx = x + (rightSide ? 5 : -5);
    const ty = rightSide ? g.y(state.dGu) + 16 : (g.y(0) + g.y(state.dGu)) / 2;
    textBox(ctx, 'ΔG‡', tx, ty - 7, { align, font: small });
    textBox(ctx, fmtEnergy(state.dGu, unit), tx, ty + 7, { align, font: `10px ${FONT}` });
  }
  if (view === 'uncat') return;

  m.barriers.forEach((b, i) => {
    const limiting = b === m.limiting;
    const side = i === 0 ? -1 : 1;
    const x = g.x(b.ts.u) + side * (g.narrow ? 16 : 24);
    guideLine(ctx, g.x(b.from.u), g.y(b.from.g), x);
    const color = limiting ? CRIMSON : TAUPE;
    verticalArrow(ctx, x, g.y(b.from.g), g.y(b.ts.g), color, limiting ? 2.5 : 1.5);
    // The label reads to the left of the arrow: past TS1 it clears the curve down to EP, and under
    // TS2 it sits inside the hump. A short arrow has no room beside it, so its label goes below, to the right.
    const tall = g.y(b.from.g) - g.y(b.ts.g) >= 44;
    const ty = tall ? (g.y(b.from.g) + g.y(b.ts.g)) / 2 : g.y(b.from.g) + 15;
    const tx = tall ? x - 5 : x + 5, align = tall ? 'right' : 'left';
    textBox(ctx, 'ΔG‡', tx, ty - 7, { align, font: small, color });
    textBox(ctx, fmtEnergy(b.barrier, unit), tx, ty + 7, { align, font: `10px ${FONT}`, color });
    if (limiting) textBox(ctx, 'Rate-limiting', tx, ty + 20, { align, font: `600 10px ${FONT}`, color: CRIMSON });
  });

  if (view === 'both' && m.tsGap !== 0) {
    // The bracket between the transition states, off to the side of the catalyzed arrow
    const ts = m.limiting.ts;
    const x = Math.max(peakX, g.x(ts.u)) + (g.narrow ? 40 : 66);
    const yTop = g.y(state.dGu), yLow = g.y(ts.g);
    guideLine(ctx, peakX, yTop, x);
    guideLine(ctx, g.x(ts.u), yLow, x);
    ctx.strokeStyle = TAUPE;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - 4, yTop);
    ctx.lineTo(x + 4, yTop);
    ctx.moveTo(x, yTop);
    ctx.lineTo(x, yLow);
    ctx.moveTo(x - 4, yLow);
    ctx.lineTo(x + 4, yLow);
    ctx.stroke();
    const yMid = (yTop + yLow) / 2;
    textBox(ctx, 'ΔΔG‡ TS to TS', x + 6, yMid - 7, { align: 'left', font: small });
    textBox(ctx, fmtEnergy(m.tsGap, unit), x + 6, yMid + 7, { align: 'left', font: `10px ${FONT}` });
  }
}

function drawOverallArrow(ctx, g, m) {
  const unit = state.unit;
  const x = g.x(1) + 14;
  guideLine(ctx, g.x(0), g.y(0), x + 4);
  guideLine(ctx, g.x(1), g.y(m.dG), x + 4);
  const same = state.view !== 'uncat';
  const yMid = (g.y(0) + g.y(m.dG)) / 2;
  if (Math.abs(m.dG) > 0.01) verticalArrow(ctx, x, g.y(0), g.y(m.dG), '#000000');
  const align = g.narrow ? 'right' : 'left';
  const tx = g.narrow ? x - 5 : x + 6;
  const lines = [['ΔG', `600 11px ${FONT}`], [fmtEnergy(m.dG, unit), `10px ${FONT}`]];
  if (same) lines.push(['same for both', `10px ${FONT}`], ['pathways', `10px ${FONT}`]);
  lines.forEach(([text, font], i) => textBox(ctx, text, tx, yMid + (i - (lines.length - 1) / 2) * 13, { align, font }));
}

// Each state's name and schematic sit side by side, above a peak and below a valley. The start goes
// above its point, clear of ES just below it, and the end stacks its two so they stay narrow.
function drawStateLabels(ctx, g, states) {
  const r = 9;
  const font = `600 ${g.narrow ? 11 : 12}px ${FONT}`;
  states.forEach(s => {
    const x = g.x(s.u), y = g.y(s.g);
    ctx.fillStyle = s.path === 'uncat' ? TAUPE : CRIMSON;
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = font;
    const textW = ctx.measureText(s.name).width;
    const half = ['S', 'S‡', 'P'].includes(s.kind) ? r * 0.9 : r * 2.1;
    if (s.u === 1) {
      textBox(ctx, s.name, x + 2, y + 13, { align: 'right', font });
      drawSpecies(ctx, s.kind, x + 2 - half, y + 21 + r, r);
      return;
    }
    const rowW = textW + 4 + half * 2;
    const rowLeft = s.u === 0 ? x - 2 : x - rowW / 2;
    const rowY = s.role === 'ts' || s.u === 0 ? y - 8 - r : y + 8 + r;
    textBox(ctx, s.name, rowLeft, rowY, { align: 'left', font });
    drawSpecies(ctx, s.kind, rowLeft + textW + 4 + half, rowY, r);
  });
}

function drawHover(ctx, g, states, W) {
  if (!hover) return;
  let best = null, bestDist = Infinity;
  states.forEach(s => {
    const d = (g.x(s.u) - hover.x) ** 2 + (g.y(s.g) - hover.y) ** 2;
    if (d < bestDist) { bestDist = d; best = s; }
  });
  if (!best || bestDist > 90 * 90) return;
  const lines = [best.name, `G = ${fmtEnergy(best.g, state.unit)}`];
  ctx.font = `600 12px ${FONT}`;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 14;
  const x = Math.min(W - w - 2, Math.max(2, g.x(best.u) - w / 2));
  const y = Math.max(2, g.y(best.g) - 46);
  ctx.fillStyle = '#FFFFFF';
  ctx.strokeStyle = TAUPE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(x, y, w, 38, 5);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#000000';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, x + 7, y + 5 + i * 15));
}

function drawDiagram(m) {
  const canvas = $('diagram');
  const { ctx, W, H } = fitCanvas(canvas);
  const g = diagramScale(m, W, H);
  const states = shownStates(m);
  const view = state.view;

  drawAxes(ctx, g, H);
  if (view !== 'cat') drawPath(ctx, g, m.uncat, TAUPE, 2.5, [8, 5]);
  if (view !== 'uncat') drawPath(ctx, g, m.cat, CRIMSON, 3, []);
  if (state.showDG) drawOverallArrow(ctx, g, m);
  if (state.showBarriers) drawBarrierArrows(ctx, g, m);
  drawStateLabels(ctx, g, states);
  drawHover(ctx, g, states, W);

  const u = state.unit;
  const parts = [];
  if (view !== 'cat') parts.push(`Uncatalyzed barrier ${fmtEnergy(state.dGu, u)}.`);
  if (view !== 'uncat') parts.push(`Catalyzed path through ${m.cat.map(s => `${s.name} at ${fmtEnergy(s.g, u)}`).join(', ')}. Rate-limiting barrier ${fmtEnergy(m.limiting.barrier, u)} at ${m.limiting.ts.name}.`);
  parts.push(`Overall ΔG ${fmtEnergy(m.dG, u)}.`);
  canvas.setAttribute('aria-label', `Free energy diagram. ${parts.join(' ')}`);
}

// ── Activity plots ──
function drawActivityPlot(canvas, curve, xMin, xMax, xTicks, xName, current, currentText, optimumText, extra) {
  const { ctx, W, H } = fitCanvas(canvas);
  const left = 44, right = W - 12, top = 26, bottom = H - 38;
  const sx = v => left + (v - xMin) / (xMax - xMin) * (right - left);
  const sy = v => bottom - v * (bottom - top);

  ctx.font = `11px ${FONT}`;
  ctx.textBaseline = 'middle';
  [0, 0.25, 0.5, 0.75, 1].forEach(v => {
    ctx.strokeStyle = '#E4E4E4';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(left, sy(v));
    ctx.lineTo(right, sy(v));
    ctx.stroke();
    ctx.fillStyle = '#000000';
    ctx.textAlign = 'right';
    ctx.fillText(v.toFixed(2).replace(/0$/, ''), left - 5, sy(v));
  });
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  xTicks.forEach(t => {
    ctx.fillStyle = '#000000';
    ctx.fillText(String(t), sx(t), bottom + 4);
  });
  ctx.strokeStyle = TAUPE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(left, top);
  ctx.lineTo(left, bottom);
  ctx.lineTo(right, bottom);
  ctx.stroke();

  ctx.fillStyle = '#000000';
  ctx.font = `600 12px ${FONT}`;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(xName, (left + right) / 2, H - 5);
  ctx.save();
  ctx.translate(11, (top + bottom) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('Relative activity', 0, 0);
  ctx.restore();

  if (extra) extra(ctx, sx, top, bottom);

  ctx.strokeStyle = CRIMSON;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  curve.pts.forEach((p, i) => (i === 0 ? ctx.moveTo(sx(p.x), sy(p.y)) : ctx.lineTo(sx(p.x), sy(p.y))));
  ctx.stroke();

  const yAt = x => curve.pts.reduce((a, b) => (Math.abs(b.x - x) < Math.abs(a.x - x) ? b : a)).y;
  const close = Math.abs(sx(curve.optimum) - sx(current)) < 90;
  // The optimum: a hollow diamond. The current value: a filled circle.
  const ox = sx(curve.optimum), oy = sy(yAt(curve.optimum));
  ctx.fillStyle = '#FFFFFF';
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ox, oy - 6);
  ctx.lineTo(ox + 6, oy);
  ctx.lineTo(ox, oy + 6);
  ctx.lineTo(ox - 6, oy);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  const edgeAlign = x => (x < left + 50 ? 'left' : x > right - 50 ? 'right' : 'center');
  textBox(ctx, optimumText, ox, Math.max(8, oy - 15), { align: edgeAlign(ox), font: `600 11px ${FONT}` });

  const cx = sx(current), cy = sy(yAt(current));
  ctx.beginPath();
  ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = CRIMSON;
  ctx.strokeStyle = '#FFFFFF';
  ctx.fill();
  ctx.stroke();
  const below = close || cy < top + 18;
  textBox(ctx, currentText, cx, cy + (below ? 17 : -15), { align: edgeAlign(cx), font: `600 11px ${FONT}`, color: CRIMSON });
}

function drawTemperaturePlot(m) {
  const canvas = $('temp-plot');
  const marker = (ctx, sx, top, bottom) => {
    if (state.Tm > TEMP_MAX) return;
    const x = sx(state.Tm);
    ctx.strokeStyle = TAUPE;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, bottom);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#000000';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.font = `600 11px ${FONT}`;
    ctx.fillText('T', x + 3, bottom - 14);
    const w = ctx.measureText('T').width;
    ctx.font = `600 9px ${FONT}`;
    ctx.fillText('m', x + 3 + w, bottom - 11);
  };
  drawActivityPlot(canvas, m.temp, TEMP_MIN, TEMP_MAX, [0, 20, 40, 60, 80], 'Temperature (°C)', state.tempC,
    `Current ${state.tempC.toFixed(0)} °C`, `Optimum ${m.temp.optimum.toFixed(0)} °C`, marker);
  canvas.setAttribute('aria-label', `Relative activity against temperature, with an optimum near ${m.temp.optimum.toFixed(0)} °C. The current temperature is ${state.tempC.toFixed(0)} °C.`);
}

function drawPHPlot(m) {
  const canvas = $('ph-plot');
  drawActivityPlot(canvas, m.ph, PH_MIN, PH_MAX, [4, 5, 6, 7, 8, 9, 10], 'pH', state.pH,
    `Current pH ${state.pH.toFixed(1)}`, `Optimum pH ${m.ph.optimum.toFixed(2)}`);
  canvas.setAttribute('aria-label', `Relative activity against pH, with an optimum at pH ${m.ph.optimum.toFixed(2)}. The current pH is ${state.pH.toFixed(1)}.`);
}

function drawAll(m) {
  drawDiagram(m);
  drawTemperaturePlot(m);
  drawPHPlot(m);
}


// ═══ 4. RENDER ════════════════════════════════════════════════

// Every change goes through here: one model, then the controls, the notes and the drawings.
function render() {
  currentModel = buildModel(state);
  syncControls();
  renderNotes(currentModel);
  drawAll(currentModel);
}
